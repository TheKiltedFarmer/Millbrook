<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Millbrook — Festival Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12172A;--panel:#1B2138;--amber:#E0A63D;--amber-dim:#8C6A2E;--parchment:#EDE6D6;--teal:#4E8B8B;--magenta:#C4497B;--line:rgba(237,230,214,0.14);--dim:rgba(237,230,214,0.62);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--parchment);font-family:'Inter',sans-serif;overflow:hidden;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;background:transparent;color:var(--parchment);border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;}
  button:hover{border-color:var(--amber-dim);}
  button.primary{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:600;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;z-index:5;}
  #hud .left{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  #hud h1{font-size:16px;}
  .daytag{font-size:11px;color:var(--amber);}
  .energy{font-size:11px;color:var(--dim);}
  .energy .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:3px;background:var(--amber);}
  .energy .dot.spent{background:rgba(237,230,214,0.15);}
  #hud .right{display:flex;gap:6px;}
  #hud .right button{padding:5px 9px;font-size:12px;}
  #gameWrap{position:relative;flex:1;overflow:hidden;background:#0D1122;}
  canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;}
  #actionHint{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(18,23,42,0.92);border:1px solid var(--amber-dim);color:var(--amber);font-size:13px;padding:6px 14px;border-radius:20px;pointer-events:none;display:none;z-index:4;max-width:88%;text-align:center;}
  #taskBanner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(27,33,56,0.94);border:1px solid var(--amber-dim);color:var(--parchment);font-size:12px;padding:5px 12px;border-radius:16px;pointer-events:none;display:none;z-index:4;max-width:92%;text-align:center;}
  #joystick{position:absolute;left:18px;bottom:18px;width:110px;height:110px;border-radius:50%;border:1.5px solid rgba(237,230,214,0.25);background:rgba(27,33,56,0.4);display:none;z-index:4;}
  #stick{position:absolute;left:37px;top:37px;width:36px;height:36px;border-radius:50%;background:rgba(224,166,61,0.55);}
  #actBtn{position:absolute;right:22px;bottom:30px;width:66px;height:66px;border-radius:50%;background:rgba(224,166,61,0.85);color:var(--bg);font-size:24px;font-weight:700;border:none;display:none;font-family:'Fraunces',serif;z-index:4;}
  @media (pointer:coarse){#joystick,#actBtn{display:block;}}
  .overlay{position:absolute;inset:0;background:rgba(13,17,34,0.88);z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 12px 40px;}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:640px;width:100%;}
  .sub{color:var(--dim);font-size:13px;line-height:1.55;margin:8px 0 12px;}
  .note{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--amber);background:rgba(224,166,61,0.07);border-left:2px solid var(--amber);padding:12px 14px;margin:14px 0;line-height:1.6;}
  .chat{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin:12px 0;padding-right:4px;}
  .bubble{max-width:82%;padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .bubble.them{background:rgba(237,230,214,0.06);border:1px solid var(--line);align-self:flex-start;}
  .bubble.me{background:rgba(224,166,61,0.14);border:1px solid var(--amber-dim);align-self:flex-end;}
  .chat-row{display:flex;gap:8px;}
  input[type=text]{flex:1;background:rgba(237,230,214,0.05);border:1px solid var(--line);color:var(--parchment);padding:9px 12px;border-radius:3px;font-size:16px;font-family:'Inter',sans-serif;}
  input[type=text]:focus{outline:none;border-color:var(--amber-dim);}
  textarea{width:100%;background:rgba(237,230,214,0.05);border:1px solid var(--line);color:var(--parchment);padding:9px 11px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:12px;min-height:48px;resize:vertical;}
  .notes{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .notes label{font-size:11px;color:var(--dim);display:block;margin-bottom:5px;}
  .susp-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  input[type=range]{flex:1;accent-color:var(--magenta);}
  .susp-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--magenta);min-width:28px;}
  .typing{color:var(--dim);font-size:12.5px;font-style:italic;padding:2px 0;}
  .sheet-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .accuse-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(237,230,214,0.04);border:1px solid var(--line);border-radius:4px;margin-bottom:7px;flex-wrap:wrap;gap:6px;}
  .tg{display:flex;gap:5px;}
  .tg button.ah{background:var(--teal);color:var(--bg);border-color:var(--teal);}
  .tg button.aa{background:var(--magenta);color:var(--bg);border-color:var(--magenta);}
  .reveal{padding:11px 13px;border-radius:4px;margin-bottom:9px;font-size:13.5px;}
  .rc{background:rgba(78,139,139,0.14);border:1px solid var(--teal);}
  .rw{background:rgba(196,73,123,0.14);border:1px solid var(--magenta);}
  .reveal .tell{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.55;font-style:italic;}
  .score{font-size:38px;font-family:'Fraunces',serif;color:var(--amber);text-align:center;margin:6px 0;}
  .journal-entry{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .hint{font-size:12px;color:var(--dim);line-height:1.6;}
  .cluecard{border:1px solid var(--amber-dim);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;background:rgba(224,166,61,0.05);}
  .tipcard{border:1px solid var(--teal);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;background:rgba(78,139,139,0.06);}
  .verdict{text-align:center;font-size:14px;line-height:1.6;margin-bottom:14px;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div id="hud">
  <div class="left">
    <h1>Millbrook</h1>
    <span class="daytag mono" id="dayTag"></span>
    <span class="energy mono" id="energyTag"></span>
  </div>
  <div class="right">
    <button id="journalBtn">Journal</button>
    <button id="sleepBtn">Sleep</button>
    <button id="accuseBtn" class="primary">Accuse</button>
  </div>
</div>
<div id="gameWrap">
  <canvas id="cv"></canvas>
  <div id="actionHint"></div>
  <div id="taskBanner"></div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="actBtn">!</button>
  <div id="overlayRoot"></div>
</div>

<script>
/* ============ CONFIG ============ */
/* PORTABLE BUILD — self-hosted config */
const API_URL='https://millbrook.justindfair.workers.dev'; // Justin's Cloudflare Worker
const storageShim={
  async get(k){const v=localStorage.getItem(k);return v==null?null:{key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v);return{key:k,value:v};},
  async delete(k){localStorage.removeItem(k);return{key:k,deleted:true};}
};
const STORE=(typeof window!=='undefined'&&window.storage&&window.storage.get)?window.storage:storageShim;
const NUM_AI=3, DAYS=7, ENERGY=6, KEY='millbrook-v5';
const TILE=32, MW=64, MH=44;
const DAY_START=8*60, DAY_END=21*60, MIN_PER_SEC=1/0.7;

/* ============ CAST (10) ============ */
const CAST=[
 {id:'dot',name:'Dot Reyes',role:'Runs The Hearth café',pal:{skin:'#E8B58A',hair:'#4A2E22',shirt:'#C25B4A',pants:'#5A4632'},
  work:'hearth',homeLabel:'Reyes Cottage',
  base:"You are Dot Reyes, mid-40s, owner of The Hearth café in the river town of Millbrook. Warm, nosy, loves gossip, short casual sentences. Widowed, 20 years in town, one grown son who rarely calls.",
  worry:"Your espresso machine is dying and you burned your wrist on it Tuesday.",
  sched:[[8,'work'],[15,'grocery'],[16,'work'],[19,'home']],
  workObsAI:"A cup of coffee behind the counter. Full. Cold.",
  workObsH:["The espresso machine lies half-disassembled; a screwdriver rests in a saucer.","Burn cream and a fresh bandage sit by the register, next to a half-eaten roll."],
  homeObsAI:"The bed is made hotel-tight. The kitchen bin is empty. So is the fridge.",
  homeObsH:["A photo of a young man in a graduation gown — the glass smudged from handling.","Dishes soak in the sink; a crossword sits half-finished, pen dropped mid-clue."],
  favor:{ask:"The flour delivery's sitting out front and my wrist is shot. Haul the sacks in for me?",task:'Flour sacks → The Hearth',from:{x:8,y:17},to:{x:13,y:16},fromLabel:'Flour sacks',thanks:"You're a lifesaver. Free coffee for life — well, for the week. Listen—"},
  ep:{caught:"The thing wearing Dot's warmth thanked the town for its hospitality and walked into the river without a splash. The Hearth stands empty.",
      missed:"The Hearth still opens at six sharp. The same full cup of coffee sits cold behind the counter, every single morning.",
      accused:"Dot didn't fight the vote. She hung the CLOSED sign, wrist still bandaged, and her son never came back for the keys.",
      cleared:"Dot's son finally called. She closed early for the first time in years and talked to him till midnight."}},
 {id:'warren',name:'Warren Ashby',role:'Retired dockworker',pal:{skin:'#D9A47C',hair:'#B8B8B0',shirt:'#5A6B78',pants:'#3E3A32'},
  work:'dockpt',homeLabel:'Ashby Cottage',
  base:"You are Warren Ashby, 60s, retired dockworker restoring an old wooden boat at Riverside Dock in Millbrook. Gruff, clipped sentences, soft underneath. Bad knees, thinks the town council is useless.",
  worry:"You're fighting with your brother Frank over your late mother's house.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[18,'tavern'],[20,'home']],

  homeObsH:["A house's worth of his mother's things, half sorted into KEEP and FRANK boxes.","An open tin of liniment on the nightstand; the cap is across the room."],
  favor:{ask:"Storm coming. Help me get these tarp rolls over to the boat before the rain does my work for me.",task:'Tarp rolls → the boat',from:{x:48,y:19},to:{x:53,y:22},fromLabel:'Tarp rolls',thanks:"Hmph. Not useless after all. Listen—"},
  ep:{caught:"It set the sanded plank down gently, nodded once, and was gone before the bonfire burned out. The boat sits untouched.",

      accused:"Warren threw his toolbox in the river and left town. The letter to Frank was never sent.",
      cleared:"Warren mailed the letter. Frank called back. They're fixing the boat together — actually fixing it."}},
 {id:'priya',name:'Priya Nandy',role:'Librarian',pal:{skin:'#B07B52',hair:'#241C18',shirt:'#6B5B8C',pants:'#33303E'},
  work:'library',homeLabel:'Nandy Cottage',
  base:"You are Priya Nandy, early 30s, librarian at Millbrook's Old Library. Precise, dry wit, guarded until warmed up, references books naturally. Moved here 4 years ago, still feels like an outsider sometimes.",

      accused:"Priya packed the water-damaged books she'd fought to save and was gone before dawn. The library is locked.",

 {id:'cole',name:'Cole Faraday',role:'Market vendor',pal:{skin:'#EDC79B',hair:'#8C5A2E',shirt:'#4E8B5A',pants:'#4A4438'},
  work:'stallpt',homeLabel:'Faraday Cottage',

 {id:'iris',name:'Iris Voss',role:'Park gardener',pal:{skin:'#E3B291',hair:'#9B8FA8',shirt:'#B0688C',pants:'#44503E'},
  work:'parkpt',homeLabel:'Voss Cottage',
  base:"You are Iris Voss, 50s, tends the gardens at Millbrook Park. Dreamy, philosophical, talks slowly about plants and seasons, occasionally oddly profound.",
  worry:"Your sciatica is flaring and deer keep eating your festival tulips.",
  sched:[[8,'work'],[12,'home'],[13,'work'],[17,'grocery'],[18,'home']],
  workObsAI:"Every planting spaced to the centimeter. Nothing nibbled. No deer tracks.",

  homeObsAI:"The windowsills are bare. Not a single pot, cutting, or seed.",
  homeObsH:["Seedlings crowd every windowsill in labeled yogurt cups.","A hot water bottle on the couch; sciatica stretches printed out, well-creased."],
  favor:{ask:"The mulch bags are by the park gate and my back has opinions today. Carry them to the beds?",task:'Mulch bags → flower beds',from:{x:7,y:31},to:{x:12,y:36},fromLabel:'Mulch bags',thanks:"The garden thanks you. So do I. Sit a moment — I notice things, you know—"},
  ep:{caught:"The flower beds were found rearranged into perfect concentric rings overnight — a goodbye, maybe. The deer came back the next day.",
      missed:"The gardens have never looked better. Perfect rows, untouched by deer. Iris says the plants 'finally listen.' Nobody asks what that means.",
      accused:"Iris left her tools on the bench with the heating pad. The tulips the deer ruined were the last thing she ever planted here.",
      cleared:"Iris rigged chicken wire and cursed the deer all week — happiest anyone's seen her. Her sciatica hates the victory dance."}},
 {id:'moss',name:'Elias Moss',role:'Clerk at the Inn',pal:{skin:'#D8AA85',hair:'#3A362E',shirt:'#7A7050',pants:'#33302A'},
  work:'inn',homeLabel:'Moss Cottage',

 {id:'sana',name:'Sana Okafor',role:'Mechanic, Okafor Auto',pal:{skin:'#8A5A3C',hair:'#1E1A16',shirt:'#C4A44E',pants:'#3A3A42'},

 {id:'june',name:'June Marsh',role:'Runs Marsh Grocery',pal:{skin:'#D9A87E',hair:'#5A3A24',shirt:'#7A9455',pants:'#464038'},

function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h);}

}

/* away / schedules */
function isAwayAllDay(id,day){const d=S.npc[id];return d.isAI&&((day+d.aiOffset)%3===0);}
function humanErrand(id,day){return srand(hashStr(id+'err'+day+S.runId))<0.15;}
function jitter(id,day,bi){const d=S.npc[id];if(d.isAI)return 0;return Math.floor(srand(hashStr(id+'j'+day+'b'+bi+S.runId))*15)-7;}
function scheduledPlace(id,min,day){
  if(isAwayAllDay(id,day))return 'away';
  const c=CAST.find(x=>x.id===id);
  if(!S.npc[id].isAI&&humanErrand(id,day)){const h=min/60;if(h>=9.5&&h<13)return 'away';}
  let place=c.sched[0][1];
  for(let i=0;i<c.sched.length;i++){
    const [h,p]=c.sched[i];
    if(min>=h*60+jitter(id,day,i))place=p;
  }
  return place;
}
function placeTarget(id,place){
  const c=CAST.find(x=>x.id===id);
  if(place==='home')return{inside:HOMES[id]};
  if(place==='work'){const w=c.work;if(POINTS[w])return{point:POINTS[w]};return{inside:w};}
  if(place==='lunch')return{inside:'hearth'};
  if(place==='tavern')return{inside:'tavern'};
  if(place==='grocery')return{inside:'grocery'};
  if(place==='square')return{point:POINTS.square};
  if(POINTS[place])return{point:POINTS[place]};
  return{inside:HOMES[id]};
}

/* ============ COLLISION & PATH ============ */
const blocked=new Set();
const DOORPATHS=new Set();
function blk(x,y){blocked.add(x+','+y);}
function buildPaths(){
  DOORPATHS.clear();
  Object.values(BLD).forEach(b=>{
    if(b.kind==='deco')return;
    const targetRow=(b.door.y<=18)?19:31;
    let y=b.door.y;
    const step=targetRow>y?1:-1;
    while(y!==targetRow&&y>0&&y<MH-1){DOORPATHS.add(b.door.x+','+y);y+=step;}
  });
}
function buildCollision(){
  blocked.clear();
  for(let y=0;y<MH;y++)for(let x=RIVER_X;x<MW;x++){
    const onPier=x>=PIER.x&&x<PIER.x+PIER.w&&y>=PIER.y&&y<PIER.y+PIER.h;
    if(!onPier)blk(x,y);
  }
  Object.values(BLD).forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)blk(x,y);});
  TREES.forEach(([x,y])=>blk(x,y));
  blk(WELL.x,WELL.y);
  for(let x=0;x<MW;x++){blk(x,0);blk(x,MH-1);}
  for(let y=0;y<MH;y++){blk(0,y);blk(1,y);}
}
function tileBlocked(x,y){return blocked.has(x+','+y);}
function isBlockedPx(px,py){return tileBlocked(Math.floor(px/TILE),Math.floor(py/TILE));}
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return[];
  const key=(x,y)=>y*MW+x;
  const prev=new Map();const q=[[sx,sy]];prev.set(key(sx,sy),-1);
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty){
      const path=[];let cx=x,cy=y;let k=key(cx,cy);
      while(prev.get(k)!==-1){path.push([cx,cy]);const p=prev.get(k);cx=p%MW;cy=Math.floor(p/MW);k=key(cx,cy);}
      return path.reverse();
    }
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      if(tileBlocked(nx,ny))continue;
      const nk=key(nx,ny);
      if(prev.has(nk))continue;
      prev.set(nk,key(x,y));q.push([nx,ny]);
    }
  }
  return null;
}

/* ============ NPC SIM ============ */
const NS={};
function initNpcs(){
  CAST.forEach(c=>{NS[c.id]={x:BLD[HOMES[c.id]].door.x*TILE,y:(BLD[HOMES[c.id]].door.y)*TILE,
    inside:HOMES[c.id],path:[],goalKey:'',face:1,step:0,idleT:0};});
}
function updateNpcs(dt){
  CAST.forEach(c=>{
    const st=NS[c.id];
    const place=scheduledPlace(c.id,S.min,S.day);
    if(place==='away'){st.away=true;return;}
    st.away=false;
    const tgt=placeTarget(c.id,place);
    const gk=tgt.inside?('i:'+tgt.inside):('p:'+tgt.point.x+','+tgt.point.y);
    if(gk!==st.goalKey){
      st.goalKey=gk;
      if(st.inside){const b=BLD[st.inside];st.x=b.door.x*TILE;st.y=b.door.y*TILE;st.inside=null;}
      const dest=tgt.inside?BLD[tgt.inside].door:tgt.point;
      const p=bfs(Math.round(st.x/TILE),Math.round(st.y/TILE),dest.x,dest.y);
      st.path=p||[];st.dest=tgt;
      if(p===null){if(tgt.inside)st.inside=tgt.inside;else{st.x=dest.x*TILE;st.y=dest.y*TILE;}}
    }
    if(st.inside)return;
    if(st.path.length){
      const [nx,ny]=st.path[0];
      const txp=nx*TILE,typ=ny*TILE;
      const dx=txp-st.x,dy=typ-st.y,dist=Math.hypot(dx,dy);
      const sp=58*dt;
      if(dist<=sp){st.x=txp;st.y=typ;st.path.shift();
        if(!st.path.length&&st.dest&&st.dest.inside)st.inside=st.dest.inside;}
      else{st.x+=dx/dist*sp;st.y+=dy/dist*sp;st.step+=dt*8;
        st.face=Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?1:0);}
    }else{
      if(!S.npc[c.id].isAI){
        st.idleT-=dt;
        if(st.idleT<=0){st.idleT=2+Math.random()*4;
          const ox=(Math.random()<0.5?-1:1),oy=(Math.random()<0.5?-1:1);
          const nx=Math.round(st.x/TILE)+ox,ny=Math.round(st.y/TILE)+oy;
          if(!tileBlocked(nx,ny)){st.path=[[nx,ny]];st.dest=null;}}
      }
    }
  });
}
function occupants(bldId){return CAST.filter(c=>!NS[c.id].away&&NS[c.id].inside===bldId);}
function bldOpen(b){
  if(b.id==='inn')return true;
  if(b.kind==='home')return true;
  if(b.kind==='deco')return false;
  return occupants(b.id).some(c=>c.id===b.owner);
}

function drawWorld(){
  camX=S.px-cw/(2*scale);camY=S.py-ch/(2*scale);
  ctx.save();ctx.scale(scale,scale);ctx.translate(-Math.round(camX),-Math.round(camY));
  const wf=Math.floor(Date.now()/500)%2;
  const x0=Math.max(0,Math.floor(camX/TILE)-1),x1=Math.min(MW,Math.ceil((camX+cw/scale)/TILE)+1);
  const y0=Math.max(0,Math.floor(camY/TILE)-1),y1=Math.min(MH,Math.ceil((camY+ch/scale)/TILE)+1);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    let t;
    if(x>=RIVER_X)t=T.water[(wf+((x+y)%2))%2];
    else if(y>=19&&y<=20&&x>2)t=T.path;
    else if(x>=28&&x<=29&&y>=8&&y<=36)t=T.path;
    else if(y>=31&&y<=32&&x>=4&&x<=52)t=T.path;
    else if(DOORPATHS.has(x+','+y))t=T.path;
    else if(x>=PARK.x&&x<PARK.x+PARK.w&&y>=PARK.y&&y<PARK.y+PARK.h)t=T.park;
    else t=T.grass[hashStr(x+'.'+y)%3===2?2:hashStr(x+'.'+y)%2];
    ctx.drawImage(t,x*TILE,y*TILE);
  }
  for(let y=PIER.y;y<PIER.y+PIER.h;y++)for(let x=PIER.x;x<PIER.x+PIER.w;x++)
    if(x>=x0&&x<x1&&y>=y0&&y<y1)ctx.drawImage(T.pier,x*TILE,y*TILE);

    ctx.fillStyle='#4A4440';ctx.fillRect(bx+bw-16,by-26,10,12);

function offersForDay(day){
  const c1=CAST.filter(c=>!isAwayAllDay(c.id,day)&&S.npc[c.id].cold<=0).map(c=>c.id);
  return [...c1].sort((a,b)=>srand(hashStr(a+'f'+day+S.runId))-srand(hashStr(b+'f'+day+S.runId))).slice(0,2);
}
function favorKey(id){return S.day+'-'+id;}
function favorStatus(id){
  if(!offersForDay(S.day).includes(id))return null;
  return S.favorState[favorKey(id)]||'pending';
}

/* ============ INTERACT ============ */
function nearestInteract(){
  const R=1.9*TILE;let best=null,bd=R;
  if(S.scene==='world'){
    if(S.activeTask){
      const c=CAST.find(x=>x.id===S.activeTask.npcId);
      if(!S.activeTask.carried&&S.activeTask.done<3){
        const d=Math.hypot(c.favor.from.x*TILE-S.px,c.favor.from.y*TILE-S.py);
        if(d<bd){bd=d;best={type:'pickup',c};}}
      if(S.activeTask.carried){
        const d=Math.hypot(c.favor.to.x*TILE-S.px,c.favor.to.y*TILE-S.py);
        if(d<bd){bd=d;best={type:'drop',c};}}
    }
    CAST.forEach(c=>{
      const st=NS[c.id];
      if(!st.away&&!st.inside){
        const d=Math.hypot(st.x-S.px,st.y-S.py);
        if(d<bd){bd=d;best={type:'npc',c};}}
    });
    OUTSPOTS.forEach(sp=>{
      const d=Math.hypot(sp.x*TILE-S.px,sp.y*TILE-S.py);
      if(d<bd){bd=d;best={type:'spot',sp};}
    });
    Object.values(BLD).forEach(b=>{
      if(b.kind==='deco')return;
      const d=Math.hypot(b.door.x*TILE-S.px,(b.door.y*TILE)-S.py);
      if(d<bd){bd=d;best={type:'door',b};}
    });
  }else{
    const bldId=S.scene;
    occupants(bldId).forEach(c=>{
      const st=NS[c.id];
      const d=Math.hypot((st.ix||0)-S.ipx,(st.iy||0)-S.ipy);
      if(d<bd){bd=d;best={type:'npc',c};}
    });
    intSpec(bldId).cont.forEach((cn,ci)=>{
      const d=Math.hypot(cn[1]*TILE-S.ipx,cn[2]*TILE-S.ipy);
      if(d<bd){bd=d;best={type:'cont',bldId,ci,name:cn[0]};}
    });
    if(bldId==='inn'){
      const db=Math.hypot(12.5*TILE-S.ipx,7.2*TILE-S.ipy);
      if(db<bd){bd=db;best={type:'sleep'};}
    }
    const d=Math.hypot(7*TILE-S.ipx,(IH-1)*TILE-S.ipy);
    if(d<bd){bd=d;best={type:'exit',bldId};}
  }
  return best;
}
function interactLabel(t){
  if(t.type==='npc')return 'Talk to '+t.c.name+'  (E)';
  if(t.type==='spot')return t.sp.label+'  (E)';
  if(t.type==='cont')return 'Search: '+t.name+'  (E)';
  if(t.type==='sleep')return S.day>=DAYS?'Turn in — tomorrow is the Festival  (E)':'Sleep in your room  (E)';
  if(t.type==='pickup')return 'Pick up: '+t.c.favor.fromLabel+'  (E)';
  if(t.type==='drop')return 'Set it down here  (E)';
  if(t.type==='exit')return 'Leave  (E)';
  if(t.type==='door'){
    const open=bldOpen(t.b);
    return open?('Enter '+t.b.label+'  (E)'):(t.b.label+' — locked, dark inside');
  }
  return'';
}
function doInteract(t){
  if(t.type==='sleep'){doSleep();return;}
  if(t.type==='door'){
    if(!bldOpen(t.b)){showToast(t.b.label+' is locked. Dark inside.');return;}
    S.scene=t.b.id;S.ipx=7*TILE;S.ipy=(IH-2)*TILE;save();return;
  }
  if(t.type==='exit'){
    const b=BLD[t.bldId];
    S.scene='world';S.px=b.door.x*TILE;S.py=(b.door.y+1)*TILE;save();return;
  }
  if(t.type==='pickup'){S.activeTask.carried=true;save();return;}
  if(t.type==='drop'){
    S.activeTask.carried=false;S.activeTask.done++;
    if(S.activeTask.done>=3){
      const c=t.c;S.favorState[S.activeTask.key]='done';
      S.npc[c.id].familiarity=Math.min(30,S.npc[c.id].familiarity+6);
      S.activeTask=null;save();openFavorDone(c);
    }else{save();showToast(t.c.favor.task+' — '+S.activeTask.done+'/3');}
    return;
  }
  if(t.type==='npc'){
    const d=S.npc[t.c.id];
    if(!d.visitedToday){
      if(S.energy<=0){showToast('No visits left today. Sleep to reset.');return;}
      S.energy--;d.visitedToday=true;save();updateHud();
    }
    openChat(t.c.id);
    return;
  }
  if(t.type==='cont'){
    const b=BLD[t.bldId];
    const ownerHere=occupants(t.bldId).some(c=>c.id===b.owner);
    if(b.kind==='home'&&ownerHere){showToast('Not with '+CAST.find(c=>c.id===b.owner).name.split(' ')[0]+' standing right there.');return;}
    const text=contObs(t.bldId,t.ci);
    S.found2=S.found2||[];
    if(!S.found2.some(e=>e.bld===t.bldId&&e.ci===t.ci&&e.day===S.day)){
      S.found2.push({bld:t.bldId,ci:t.ci,day:S.day,who:b.owner,label:t.name,text,sig:t.ci===sigIndex(t.bldId)});
      save();
    }
    openObs({label:t.name},text);
    return;
  }
  if(t.type==='spot'){
    const sp=t.sp;
    const fkey=sp.charId+'-'+sp.kind+'-d'+S.day;
    const obs=spotObs(sp.charId,sp.kind);
    if(!S.found[fkey]){S.found[fkey]=obs;save();}
    openObs(sp,obs);
    return;
  }
}
function showToast(msg){
  const h=document.getElementById('actionHint');
  h.innerText=msg;h.style.display='block';
  setTimeout(()=>{h.style.display='none';},2100);
}

/* ============ LOOP ============ */
let last=0,forcedSleep=false,lastMinShown=-1;
function realLoop(ts){
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(!paused){
    S.min+=dt*MIN_PER_SEC;
    if(S.min>=DAY_END&&!forcedSleep){forcedSleep=true;openNightfall();}
    let vx=0,vy=0;
    if(keys['w']||keys['arrowup'])vy-=1;
    if(keys['s']||keys['arrowdown'])vy+=1;
    if(keys['a']||keys['arrowleft'])vx-=1;
    if(keys['d']||keys['arrowright'])vx+=1;
    vx+=joyVec.x;vy+=joyVec.y;
    const m=Math.hypot(vx,vy);
    if(m>0.1){
      vx/=Math.max(1,m);vy/=Math.max(1,m);
      const sp=135*dt;
      if(S.scene==='world'){
        const nx=S.px+vx*sp,ny=S.py+vy*sp;
        if(!isBlockedPx(nx+16,S.py+22)&&!isBlockedPx(nx+16,S.py+8))S.px=nx;
        if(!isBlockedPx(S.px+16,ny+22)&&!isBlockedPx(S.px+16,ny+8))S.py=ny;
      }else{
        const nx=S.ipx+vx*sp,ny=S.ipy+vy*sp;
        const bid=S.scene;
        if(!intBlocked(bid,Math.floor((nx+16)/TILE),Math.floor((S.ipy+22)/TILE))&&!intBlocked(bid,Math.floor((nx+16)/TILE),Math.floor((S.ipy+8)/TILE)))S.ipx=nx;
        if(!intBlocked(bid,Math.floor((S.ipx+16)/TILE),Math.floor((ny+22)/TILE))&&!intBlocked(bid,Math.floor((S.ipx+16)/TILE),Math.floor((ny+8)/TILE)))S.ipy=ny;
      }
      playerStep+=dt*8;
      playerFace=Math.abs(vx)>Math.abs(vy)?(vx>0?2:3):(vy>0?1:0);
    }
    updateNpcs(dt);
    const t=nearestInteract();
    const hint=document.getElementById('actionHint');
    if(t&&hint.dataset.toast!=='1'){hint.innerText=interactLabel(t);hint.style.display='block';}
    else if(!t&&hint.dataset.toast!=='1')hint.style.display='none';
    const tb=document.getElementById('taskBanner');
    if(tb){
      if(S.activeTask&&S.scene==='world'){
        const tc=CAST.find(x=>x.id===S.activeTask.npcId);
        tb.innerText=(S.activeTask.carried?'Carrying — ':'')+tc.favor.task+' · '+S.activeTask.done+'/3 · follow the gold arrow';
        tb.style.display='block';
      }else tb.style.display='none';
    }
    const mm=Math.floor(S.min);
    if(mm!==lastMinShown){lastMinShown=mm;updateHud();}
    draw();
  }
  requestAnimationFrame(realLoop);
}

/* ============ HUD ============ */
function fmtTime(){const h=Math.floor(S.min/60),m=Math.floor(S.min%60);return h+':'+(m<10?'0':'')+m;}
function updateHud(){
  document.getElementById('dayTag').innerText='DAY '+S.day+'/'+DAYS+' · '+fmtTime();
  let dots='';for(let i=0;i<ENERGY;i++)dots+='<span class="dot '+(i<S.energy?'':'spent')+'"></span>';
  document.getElementById('energyTag').innerHTML='VISITS '+dots;
  document.getElementById('sleepBtn').innerText=S.day>=DAYS?'Festival →':'Sleep';
}
async function doSleep(){
  if(S.day>=DAYS){openAccuse();return;}
  let broke=[];
  offersForDay(S.day).forEach(id=>{
    if(S.favorState[favorKey(id)]==='accepted'){
      S.favorState[favorKey(id)]='failed';
      S.npc[id].cold=2;S.failCount++;
      broke.push(CAST.find(c=>c.id===id).name.split(' ')[0]);
    }
  });
  S.activeTask=null;forcedSleep=false;
  CAST.forEach(c=>{if(S.npc[c.id].cold>0)S.npc[c.id].cold--;S.npc[c.id].visitedToday=false;});
  S.day++;S.min=DAY_START;S.energy=ENERGY;
  S.scene='world';S.px=45*TILE;S.py=16*TILE;
  await save();updateHud();closeOverlay();
  if(broke.length)showToast('You never showed for '+broke.join(' and ')+'. Word travels.');
  else{
    const left=DAYS-S.day;
    showToast('Day '+S.day+'. '+(left===0?'The Festival is tonight.':left+' day'+(left===1?'':'s')+' until the Festival.'));
  }
}

function cycleOpt(field,dir){
  const p=S.player;
  if(field==='longHair'){p.longHair=!p.longHair;}
  else if(field==='outfit'){const i=Math.max(0,OUTFITS.indexOf(p.outfit));p.outfit=OUTFITS[(i+dir+OUTFITS.length)%OUTFITS.length];}
  else if(field==='hat'){const i=Math.max(0,HATS.indexOf(p.hat));p.hat=HATS[(i+dir+HATS.length)%HATS.length];}

    const pl=ti.querySelector('.pingLink');
    if(pl)pl.onclick=async()=>{
      pl.innerText='testing…';
      const p=await pingAPI();
      const ti2=document.getElementById('typingIndicator');
      if(!ti2)return;
      if(p.ok){
        ti2.innerHTML='<div class="typing">(Connection test: OK — the bridge is back. <span class="retryLink" style="color:var(--amber);cursor:pointer;text-decoration:underline;">Tap to retry</span>)</div>';
        const rl2=ti2.querySelector('.retryLink');if(rl2)rl2.onclick=retryFn;
      }else{
        ti2.innerHTML='<div class="typing">(Connection test failed too — '+esc(p.err)+'. This is the Claude app\'s API bridge, not the game or your progress. Usual fixes: close and reopen this artifact, switch to Wi-Fi, or try again in a minute. <span class="retryLink" style="color:var(--amber);cursor:pointer;text-decoration:underline;">Retry</span>)</div>';
        const rl3=ti2.querySelector('.retryLink');if(rl3)rl3.onclick=retryFn;
      }

  };

  const doSend=async()=>{

  };

async function getReply(c,d,opener){
  let system=c.base+SHARED;
  if(d.isAI)system+=AI_OVERLAY;else system+=HUMAN_OVERLAY+c.worry;
  if(d.cold>0)system+=COLD_OVERLAY;
  else if(S.failCount>=3&&!d.isAI)system+=GUARDED_OVERLAY;
  if(d.familiarity>=12&&d.cold<=0)system+="\nThe player has earned your trust — open up more; share something personal you wouldn't tell a stranger.";
  if(favorStatus(c.id)==='done')system+="\nThe player helped you with a chore today — you're warm and grateful.";
  const place=scheduledPlace(c.id,S.min,S.day);
  const placeName={work:'at work',lunch:'having lunch at The Hearth',tavern:'at the Anchor Tap',grocery:'at Marsh Grocery',home:'at home',square:'out by the square'}[place]||'around town';
  system+='\nIt is Day '+S.day+' of Festival Week (the Festival is Day '+DAYS+'), around '+fmtTime()+'. You are currently '+placeName+'.';
  if(opener)system+='\nThe player has just walked up to you. YOU speak first: greet or acknowledge them in ONE short in-character line, grounded in where you are and what you\'re doing right now. If you\'ve talked before, greet them like a familiar face; if this is the first time, size up the newcomer the way your character would.';
  if(favorStatus(c.id)==='pending'&&d.cold<=0){
    if(d.familiarity>=3)system+='\nYou could genuinely use a hand today with this: "'+c.favor.ask+'" — if the conversation turns friendly, you may mention offhand that you\'re swamped or behind, but do NOT directly ask this newcomer for help; wait for them to offer.';
    else system+='\nYou are behind on chores today, but this person is still a stranger — you would never ask a stranger for a favor. At most, grumble vaguely about a busy day.';
  }
  const awayToday=CAST.filter(x=>x.id!==c.id&&isAwayAllDay(x.id,S.day)).map(x=>x.name.split(' ')[0]);
  if(awayToday.length)system+='\nOut of town today (you may mention if asked): '+awayToday.join(', ')+'.';
  const aboutThem=S.tips.filter(t=>t.about===c.id).map(t=>'"'+t.text+'"');
  if(aboutThem.length)system+='\nRumors circulating about you that the player may raise (react in character — a real person might laugh, explain, or take offense): '+aboutThem.join(' | ');
  const byThem=S.tips.filter(t=>t.from===c.id).map(t=>'"'+t.text+'"');
  if(byThem.length)system+='\nThings you told the player about others recently (own them if raised): '+byThem.join(' | ');
  const msgs=[];
  d.history.slice(-16).forEach(m=>{
    if(msgs.length&&msgs[msgs.length-1].role===m.role)msgs[msgs.length-1].content+='\n'+m.text;
    else msgs.push({role:m.role,content:m.text});
  });
  if(!msgs.length||msgs[0].role!=='user')msgs.unshift({role:'user',content:'(I walk up to you.)'});
  if(msgs[msgs.length-1].role!=='user')msgs.push({role:'user',content:'(I walk up to you.)'});
  let lastErr='network error';
  for(let attempt=0;attempt<5;attempt++){
    try{
      const res=await fetch(API_URL,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages:msgs})
      });
      let data={};
      try{data=await res.json();}catch(je){lastErr='bad response (HTTP '+res.status+')';}
      if(data&&data.error){lastErr=(data.error.type||'api error')+(data.error.message?': '+String(data.error.message).slice(0,90):'');}
      else if(!res.ok){lastErr='HTTP '+res.status;}
      const t=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
      if(t)return {ok:true,text:t};
    }catch(e){lastErr=(e&&e.message)?String(e.message).slice(0,90):'network error';}
    await new Promise(r=>setTimeout(r,500*(attempt+1)+Math.random()*400));
  }
  return {ok:false,err:lastErr};
}
async function pingAPI(){
  try{
    const res=await fetch(API_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:'user',content:'Reply with the single word: pong'}]})
    });
    let data={};try{data=await res.json();}catch(e){}
    if(data&&data.error)return{ok:false,err:(data.error.type||'api error')+(data.error.message?': '+String(data.error.message).slice(0,90):'')};
    if(!res.ok)return{ok:false,err:'HTTP '+res.status};
    const t=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    return t?{ok:true}:{ok:false,err:'empty response'};
  }catch(e){return{ok:false,err:(e&&e.message)?String(e.message).slice(0,90):'network error'};}
}

  });
  const rows=CAST.map(c=>{
    const d=S.npc[c.id];
    const truth=d.isAI?'REPLACED':'HUMAN';
    const right=(d.isAI&&d.guess==='ai')||(!d.isAI&&d.guess==='human');

    if(d.isAI)ep=d.guess==='ai'?c.ep.caught:c.ep.missed;
    else ep=d.guess==='ai'?c.ep.accused:c.ep.cleared;
    return '<div class="reveal '+(right?'rc':'rw')+'">'
      +'<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">'
      +'<strong>'+c.name+'</strong>'
      +'<span class="mono" style="font-size:11px;">'+truth+' — you said '+(d.guess==='ai'?'REPLACED':'HUMAN')+' '+(right?'✓':'✗')+'</span>'
      +'</div><div class="tell">'+ep+'</div></div>';
  }).join('');
  let banner;
  if(caught===3&&innocent===0){
    banner="You named all three. Millbrook exhales. What became of the real three, no one ever learned — the town lights three candles at every Festival now."+(S.failCount>=3?" And some folks still remember the promises you dropped along the way.":"");
  }else if(caught===2){
    banner="Two imposters unmasked — but an innocent paid for your certainty, and something still walks Millbrook wearing a friendly face.";
  }else{
    banner="The vote turns. By midnight the loudest voice at the bonfire is asking how the newcomer knew so much. You leave Millbrook before dawn.";
  }
  const coda=missed>0?'<div class="verdict" style="color:var(--magenta);font-style:italic;">On the Festival\'s last night, two more strangers checked into the Inn.</div>':'';
  OR.innerHTML='<div class="overlay"><div class="sheet">'
    +'<h3>The Founders\' Festival</h3>'
    +'<div class="score">'+caught+' / '+NUM_AI+' unmasked</div>'
    +'<div class="verdict">'+banner+'</div>'
    +rows+coda
    +'<div class="sheet-actions"><button class="primary" id="againBtn">Begin again — a different spring, different replacements</button></div>'
    +'</div></div>';
  document.getElementById('againBtn').onclick=async()=>{
    S=newGame();await save();initNpcs();updateHud();openIntro();
  };
}

/* ============ INIT ============ */
(async function(){
  await load();
  buildCollision();
  buildPaths();
  buildTiles();
  initNpcs();
  CAST.forEach(c=>{
    const place=scheduledPlace(c.id,S.min,S.day);
    if(place==='away'){NS[c.id].away=true;return;}
    const tgt=placeTarget(c.id,place);
    const st=NS[c.id];
    st.goalKey=tgt.inside?('i:'+tgt.inside):('p:'+tgt.point.x+','+tgt.point.y);
    if(tgt.inside){st.inside=tgt.inside;}
    else{st.inside=null;st.x=tgt.point.x*TILE;st.y=tgt.point.y*TILE;}
  });
  resize();
  updateHud();
  if(S.ended)openResults();
  else if(!S.started)openIntro();
  else paused=false;
  requestAnimationFrame(realLoop);
})();
</script>
