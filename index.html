<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Millbrook — Festival Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12172A;--panel:#1B2138;--amber:#E0A63D;--amber-dim:#8C6A2E;--parchment:#EDE6D6;--teal:#4E8B8B;--magenta:#C4497B;--line:rgba(237,230,214,0.14);--dim:rgba(237,230,214,0.62);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--parchment);font-family:'Inter',sans-serif;overflow:hidden;display:flex;flex-direction:column;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;background:transparent;color:var(--parchment);border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;}
  button:hover{border-color:var(--amber-dim);}
  button.primary{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:600;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap;z-index:5;}
  #hud .left{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  #hud h1{font-size:16px;}
  .daytag{font-size:11px;color:var(--amber);}
  .energy{font-size:11px;color:var(--dim);}
  .energy .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:3px;background:var(--amber);}
  .energy .dot.spent{background:rgba(237,230,214,0.15);}
  #hud .right{display:flex;gap:6px;}
  #hud .right button{padding:5px 9px;font-size:12px;}
  #gameWrap{position:relative;flex:1;overflow:hidden;background:#0D1122;}
  canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated;}
  #actionHint{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(18,23,42,0.92);border:1px solid var(--amber-dim);color:var(--amber);font-size:13px;padding:6px 14px;border-radius:20px;pointer-events:none;display:none;z-index:4;max-width:88%;text-align:center;}
  #taskBanner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(27,33,56,0.94);border:1px solid var(--amber-dim);color:var(--parchment);font-size:12px;padding:5px 12px;border-radius:16px;pointer-events:none;display:none;z-index:4;max-width:92%;text-align:center;}
  #joystick{position:absolute;left:18px;bottom:18px;width:110px;height:110px;border-radius:50%;border:1.5px solid rgba(237,230,214,0.25);background:rgba(27,33,56,0.4);display:none;z-index:4;}
  #stick{position:absolute;left:37px;top:37px;width:36px;height:36px;border-radius:50%;background:rgba(224,166,61,0.55);}
  #actBtn{position:absolute;right:22px;bottom:30px;width:66px;height:66px;border-radius:50%;background:rgba(224,166,61,0.85);color:var(--bg);font-size:24px;font-weight:700;border:none;display:none;font-family:'Fraunces',serif;z-index:4;}
  @media (pointer:coarse){#joystick,#actBtn{display:block;}}
  .overlay{position:absolute;inset:0;background:rgba(13,17,34,0.88);z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 12px 40px;}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:640px;width:100%;}
  .sub{color:var(--dim);font-size:13px;line-height:1.55;margin:8px 0 12px;}
  .note{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--amber);background:rgba(224,166,61,0.07);border-left:2px solid var(--amber);padding:12px 14px;margin:14px 0;line-height:1.6;}
  .chat{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;margin:12px 0;padding-right:4px;}
  .bubble{max-width:82%;padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .bubble.them{background:rgba(237,230,214,0.06);border:1px solid var(--line);align-self:flex-start;}
  .bubble.me{background:rgba(224,166,61,0.14);border:1px solid var(--amber-dim);align-self:flex-end;}
  .chat-row{display:flex;gap:8px;}
  input[type=text]{flex:1;background:rgba(237,230,214,0.05);border:1px solid var(--line);color:var(--parchment);padding:9px 12px;border-radius:3px;font-size:16px;font-family:'Inter',sans-serif;}
  input[type=text]:focus{outline:none;border-color:var(--amber-dim);}
  textarea{width:100%;background:rgba(237,230,214,0.05);border:1px solid var(--line);color:var(--parchment);padding:9px 11px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:12px;min-height:48px;resize:vertical;}
  .notes{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .notes label{font-size:11px;color:var(--dim);display:block;margin-bottom:5px;}
  .susp-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
  input[type=range]{flex:1;accent-color:var(--magenta);}
  .susp-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--magenta);min-width:28px;}
  .typing{color:var(--dim);font-size:12.5px;font-style:italic;padding:2px 0;}
  .sheet-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .accuse-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(237,230,214,0.04);border:1px solid var(--line);border-radius:4px;margin-bottom:7px;flex-wrap:wrap;gap:6px;}
  .tg{display:flex;gap:5px;}
  .tg button.ah{background:var(--teal);color:var(--bg);border-color:var(--teal);}
  .tg button.aa{background:var(--magenta);color:var(--bg);border-color:var(--magenta);}
  .reveal{padding:11px 13px;border-radius:4px;margin-bottom:9px;font-size:13.5px;}
  .rc{background:rgba(78,139,139,0.14);border:1px solid var(--teal);}
  .rw{background:rgba(196,73,123,0.14);border:1px solid var(--magenta);}
  .reveal .tell{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.55;font-style:italic;}
  .score{font-size:38px;font-family:'Fraunces',serif;color:var(--amber);text-align:center;margin:6px 0;}
  .journal-entry{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .hint{font-size:12px;color:var(--dim);line-height:1.6;}
  .cluecard{border:1px solid var(--amber-dim);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;background:rgba(224,166,61,0.05);}
  .tipcard{border:1px solid var(--teal);border-radius:4px;padding:10px 12px;margin-bottom:8px;font-size:13px;background:rgba(78,139,139,0.06);}
  .verdict{text-align:center;font-size:14px;line-height:1.6;margin-bottom:14px;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>
</head>
<body>
<div id="hud">
  <div class="left">
    <h1>Millbrook</h1>
    <span class="daytag mono" id="dayTag"></span>
    <span class="energy mono" id="energyTag"></span>
  </div>
  <div class="right">
    <button id="menuBtn">Menu</button>
    <button id="journalBtn">Journal</button>
    <button id="sleepBtn">Sleep</button>
    <button id="accuseBtn" class="primary">Accuse</button>
  </div>
</div>
<div id="gameWrap">
  <canvas id="cv"></canvas>
  <div id="actionHint"></div>
  <div id="taskBanner"></div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="actBtn">!</button>
  <div id="overlayRoot"></div>
</div>

<script>
/* ============ CONFIG ============ */
/* PORTABLE BUILD — self-hosted config */
const storageShim={
  async get(k){const v=localStorage.getItem(k);return v==null?null:{key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v);return{key:k,value:v};},
  async delete(k){localStorage.removeItem(k);return{key:k,deleted:true};}
};
const STORE=(typeof window!=='undefined'&&window.storage&&window.storage.get)?window.storage:storageShim;
const NUM_AI=4, DAYS=7, ENERGY=7, KEY='millbrook-v6';
/* Set this to the Aubes' own shop / support link to show a Support entry in the Menu. Empty = hidden. */
const SUPPORT_URL='';
const SUPPORT_LABEL='The Gloomstead is a real bakery — visit them';
const ANTHROPIC_URL="https://api.anthropic.com/v1/messages";
let BRIDGE_URL='https://millbrook.justindfair.workers.dev';
const KEYSTORE='millbrook-apikey';
function userKey(){try{return (localStorage.getItem(KEYSTORE)||'').trim();}catch(e){return '';}}
function setUserKey(k){try{k?localStorage.setItem(KEYSTORE,k.trim()):localStorage.removeItem(KEYSTORE);}catch(e){}}
function apiCall(body){
  const k=userKey();
  if(k){
    return fetch(ANTHROPIC_URL,{method:'POST',headers:{
      'content-type':'application/json','x-api-key':k,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'
    },body:JSON.stringify(body)});
  }
  return fetch(BRIDGE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}
const TILE=32, MW=64, MH=58;
const WOODS_Y0=42, WOODS_Y1=56;
const TRAIL=new Set();
const DAY_START=8*60, DAY_END=21*60, MIN_PER_SEC=1/0.7;

/* ============ CAST (10) ============ */
const CAST=[
 {id:'dot',name:'Dot Reyes',role:'Runs The Hearth café',pal:{skin:'#E8B58A',hair:'#4A2E22',shirt:'#C25B4A',pants:'#5A4632'},
  work:'hearth',homeLabel:'Reyes Cottage',
  base:"You are Dot Reyes, mid-40s, owner of The Hearth café in the river town of Millbrook. Warm, nosy, loves gossip, short casual sentences. Widowed, 20 years in town, one grown son who rarely calls.",
  worry:"Your espresso machine is dying and you burned your wrist on it Tuesday.",
  sched:[[8,'work'],[15,'grocery'],[16,'work'],[19,'home']],
  workObsAI:"A cup of coffee behind the counter. Full. Cold.",
  workObsH:["The espresso machine lies half-disassembled; a screwdriver rests in a saucer.","Burn cream and a fresh bandage sit by the register, next to a half-eaten roll."],
  homeObsAI:"The bed is made hotel-tight. The kitchen bin is empty. So is the fridge.",
  homeObsH:["A photo of a young man in a graduation gown — the glass smudged from handling.","Dishes soak in the sink; a crossword sits half-finished, pen dropped mid-clue."],
  favor:{ask:"The flour delivery's sitting out front and my wrist is shot. Haul the sacks in for me?",task:'Flour sacks → The Hearth',from:{x:8,y:17},to:{x:13,y:16},fromLabel:'Flour sacks',thanks:"You're a lifesaver. Free coffee for life — well, for the week. Listen—"},
  off:{work:["Machine's dying. I've had the guts of it out twice this week and it still screams at me.","Busy. Everyone wants coffee and nobody wants to wait for it."],sense:["Burnt sugar and steam. Gets in your hair — you stop smelling it and then somebody tells you.","Hot metal and milk. And my wrist, if you want the honest answer."],mood:["Long enough that I burned myself Tuesday and only noticed at closing.","On my feet since five, love. Ask me something easy."]},
  ep:{caught:"The thing wearing Dot's warmth thanked the town for its hospitality and walked into the river without a splash. The Hearth stands empty.",
      missed:"The Hearth still opens at six sharp. The same full cup of coffee sits cold behind the counter, every single morning.",
      accused:"Dot didn't fight the vote. She hung the CLOSED sign, wrist still bandaged, and her son never came back for the keys.",
      cleared:"Dot's son finally called. She closed early for the first time in years and talked to him till midnight."}},
 {id:'warren',name:'Warren Ashby',role:'Retired dockworker',pal:{skin:'#D9A47C',hair:'#B8B8B0',shirt:'#5A6B78',pants:'#3E3A32',hat:'flatcap'},
  work:'dockpt',homeLabel:'Ashby Cottage',
  base:"You are Warren Ashby, 60s, retired dockworker restoring an old wooden boat at Riverside Dock in Millbrook. Gruff, clipped sentences, soft underneath. Bad knees, thinks the town council is useless.",
  worry:"You're fighting with your brother Frank over your late mother's house.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[18,'tavern'],[20,'home']],
  workObsAI:"One plank, sanded satin-smooth, lies across the sawhorses. No sawdust anywhere else.",
  workObsH:["Knee-brace wrappers in the toolbox; fresh sawdust everywhere.","A crumpled letter under a wrench: 'Frank, you stubborn—' and nothing after."],
  homeObsAI:"Everything is in its place. The armchair cushion holds no dent.",
  homeObsH:["A house's worth of his mother's things, half sorted into KEEP and FRANK boxes.","An open tin of liniment on the nightstand; the cap is across the room."],
  favor:{ask:"Storm coming. Help me get these tarp rolls over to the boat before the rain does my work for me.",task:'Tarp rolls → the boat',from:{x:48,y:19},to:{x:53,y:22},fromLabel:'Tarp rolls',thanks:"Hmph. Not useless after all. Listen—"},
  off:{work:["Slow. Wood doesn't care about your schedule.","Sanding. Still sanding. Ask me again in a month."],sense:["Sawdust and river. Cold in the knuckles by four.","Tar and wet rope down here. Always has been."],mood:["Aye. Knees are talking and my brother isn't.","Long enough. What is it you want?"]},
  ep:{caught:"It set the sanded plank down gently, nodded once, and was gone before the bonfire burned out. The boat sits untouched.",
      missed:"Warren still 'works' on the boat. Same plank, smoother every day. The river doesn't seem to mind.",
      accused:"Warren threw his toolbox in the river and left town. The letter to Frank was never sent.",
      cleared:"Warren mailed the letter. Frank called back. They're fixing the boat together — actually fixing it."}},
 {id:'priya',name:'Priya Nandy',role:'Librarian',pal:{skin:'#B07B52',hair:'#241C18',shirt:'#6B5B8C',pants:'#33303E'},
  work:'library',homeLabel:'Nandy Cottage',
  base:"You are Priya Nandy, early 30s, librarian at Millbrook's Old Library. Precise, dry wit, guarded until warmed up, references books naturally. Moved here 4 years ago, still feels like an outsider sometimes.",
  worry:"The library basement flooded and you've barely slept dealing with it — some nights you just sleep at the library.",
  sched:[[8,'home'],[9,'work'],[13,'lunch'],[14,'work'],[18,'home']],
  workObsAI:"The returns cart: alphabetized, spines flush to the millimeter.",
  workObsH:["Wet books fan open under the window, weighted with staplers.","A dehumidifier growls in the basement doorway; extension cords snake upstairs."],
  homeObsAI:"No books anywhere in the house. Not one.",
  homeObsH:["The bed looks unslept-in; an open suitcase of clothes sits on it.","Tea rings on every surface. A novel splayed face-down, spine broken."],
  favor:{ask:"The basement flooded and half the archive is in wet boxes out by the cellar hatch. My arms gave out an hour ago. Carry them in?",task:'Wet boxes → the Library',from:{x:19,y:16},to:{x:23,y:15},fromLabel:'Wet boxes',thanks:"Thank you. Truly. …Since you're clearly the observant type—"},
  off:{work:["The basement flooded. I've been drying books with staplers and prayer.","Behind. Half the archive's in boxes and some of it's finished."],sense:["Wet paper. It's a sad smell — sweetish, like mushrooms getting ideas.","Damp and dust. My hands are cold the whole time I'm down there."],mood:["I slept at the desk twice this week. Don't repeat that.","Long. I'd honestly rather talk about books."]},
  ep:{caught:"It returned every book to its exact place, locked the library, and left the key in the door. The shelves have never been so quiet.",
      missed:"The library runs flawlessly now. No book is ever late. Priya never seems to sleep — and never seems to need to.",
      accused:"Priya packed the water-damaged books she'd fought to save and was gone before dawn. The library is locked.",
      cleared:"The basement dried out. Priya sleeps at home again — mostly. The town finally feels like hers."}},
 {id:'cole',name:'Cole Faraday',role:'Market vendor',pal:{skin:'#EDC79B',hair:'#8C5A2E',shirt:'#4E8B5A',pants:'#4A4438'},
  work:'stallpt',homeLabel:'Faraday Cottage',
  base:"You are Cole Faraday, late 20s, runs a produce stall at Millbrook's Town Square Market. Chatty, upbeat, a hustler, cracks jokes, tries to sell you things. Grew up here, dreams of opening a real shop.",
  worry:"Your truck failed inspection and you're panicking about hauling produce for the Festival.",
  sched:[[8,'work'],[14,'grocery'],[15,'work'],[19,'tavern'],[20,'home']],
  workObsAI:"The ledger lies open: identical handwriting, no smudges, forty flawless pages.",
  workObsH:["A failed inspection notice, folded small, tucked under the cash box.","A napkin dense with arithmetic; most of the sums are crossed out."],
  homeObsAI:"The trash bin holds a single, neatly folded bag. Nothing else.",
  homeObsH:["Shop-window sketches papered over one wall: 'FARADAY'S — someday.'","Instant noodle cups in the sink; truck keys hang on a nail by a lucky rabbit's foot."],
  favor:{ask:"Buddy! Crates. Rush. My back. Your legs. Deal? I'll make it worth your while.",task:"Produce crates → Cole's stall",from:{x:24,y:30},to:{x:28,y:28},fromLabel:'Produce crates',thanks:"You beautiful person. Apple's on the house. Hey, between us—"},
  off:{work:["Great. Fine. Truck failed inspection and I'm pretending that's fine.","Selling. Slowly. You want apples? I'll do you a price."],sense:["Cold hands and bruised fruit. Sweetest right when it's going over — that's the trick of it.","Canvas and diesel. Mostly diesel, this week."],mood:["Doing sums on napkins at midnight kind of week.","I'm alright. I'm always alright. Apples?"]},
  ep:{caught:"The ledger was left open on the stall — forty flawless pages — and a single note: 'Good luck with the shop.'",
      missed:"Cole's stall thrives. His sums are always perfect, his prices exactly fair. He never haggles anymore, and no one asks why.",
      accused:"Cole's stall never reopened. The inspection notice is still folded under the cash box, desperate math and all.",
      cleared:"Sana fixed the truck for cost. Cole made the Festival haul — and there's a FOR LEASE sign downtown he keeps walking past, slowly."}},
 {id:'iris',name:'Iris Voss',role:'Park gardener',pal:{skin:'#E3B291',hair:'#9B8FA8',shirt:'#B0688C',pants:'#44503E'},
  work:'parkpt',homeLabel:'Voss Cottage',
  base:"You are Iris Voss, 50s, tends the gardens at Millbrook Park. Dreamy, philosophical, talks slowly about plants and seasons, occasionally oddly profound.",
  worry:"Your sciatica is flaring and deer keep eating your festival tulips.",
  sched:[[8,'work'],[12,'home'],[13,'work'],[17,'grocery'],[18,'home']],
  workObsAI:"Every planting spaced to the centimeter. Nothing nibbled. No deer tracks.",
  workObsH:["Hoofprints stomp straight through a ruined tulip bed.","A heating pad and a cold thermos sit abandoned on the bench."],
  homeObsAI:"The windowsills are bare. Not a single pot, cutting, or seed.",
  homeObsH:["Seedlings crowd every windowsill in labeled yogurt cups.","A hot water bottle on the couch; sciatica stretches printed out, well-creased."],
  favor:{ask:"The mulch bags are by the park gate and my back has opinions today. Carry them to the beds?",task:'Mulch bags → flower beds',from:{x:7,y:31},to:{x:12,y:36},fromLabel:'Mulch bags',thanks:"The garden thanks you. So do I. Sit a moment — I notice things, you know—"},
  off:{work:["Deer went through the tulips. Straight through, no manners at all.","Slow. The beds want mulching and my back has opinions."],sense:["Wet soil, mostly. Green, and a bit like rain before it arrives.","Cold on the knees. Sharp smell when you cut the stems."],mood:["Sciatica's flaring. I sit more than I'd like to admit.","Long as any. The garden doesn't care either way."]},
  ep:{caught:"The flower beds were found rearranged into perfect concentric rings overnight — a goodbye, maybe. The deer came back the next day.",
      missed:"The gardens have never looked better. Perfect rows, untouched by deer. Iris says the plants 'finally listen.' Nobody asks what that means.",
      accused:"Iris left her tools on the bench with the heating pad. The tulips the deer ruined were the last thing she ever planted here.",
      cleared:"Iris rigged chicken wire and cursed the deer all week — happiest anyone's seen her. Her sciatica hates the victory dance."}},
 {id:'moss',name:'Elias Moss',role:'Clerk at the Inn',pal:{skin:'#D8AA85',hair:'#3A362E',shirt:'#7A7050',pants:'#33302A'},
  work:'inn',homeLabel:'Moss Cottage',
  base:"You are Elias Moss, 40s, clerk at the Millbrook Inn. Quiet, observant, sees everyone who passes through, dark sense of humor, drinks too much coffee. Works late, sleeps odd hours.",
  worry:"You're covering double shifts because the other clerk quit without notice.",
  sched:[[8,'home'],[13,'square'],[14,'work'],[21,'home']],
  workObsAI:"The desk log: entries at exactly 1:00, 2:00, 3:00. Every hour. Every night.",
  workObsH:["Six coffee cups ring the register in various states of empty.","The staff rota has the other shift crossed out in strokes deep enough to tear the paper."],
  homeObsAI:"Blackout curtains — but the bed is cold and the pillow uncreased.",
  homeObsH:["Blackout curtains, earplugs, and a white-noise machine still humming.","A book of crossword puzzles, every one solved in the margins during shifts."],
  favor:{ask:"The linen cart's been sitting outside since noon and check-ins start soon. Wheel the bundles in for me?",task:'Linen bundles → the Inn',from:{x:42,y:17},to:{x:45,y:15},fromLabel:'Linen cart',thanks:"Appreciated. I see everyone who comes through this town, you know. For instance—"},
  off:{work:["Doubles. The other clerk quit without notice, so it's me and the coffee.","Quiet. People come, people go, I write it down."],sense:["Old carpet and coffee gone bitter. Bit of woodsmoke off the guests.","Cold, at three in the morning. That's what it's like."],mood:["I've been awake so long I've come round the other side of it.","Long. Six cups long."]},
  ep:{caught:"The desk log ends mid-line at exactly 3:00. The Inn's front door was found open, letting the cold in. Nothing taken.",
      missed:"The Inn runs itself these days. Every guest checked in at the top of the hour. Elias never looks tired anymore.",
      accused:"Elias worked one last double, left the keys on the log book, and caught the first bus out. The Inn hires two clerks now.",

 {id:'sana',name:'Sana Okafor',role:'Mechanic, Okafor Auto',pal:{skin:'#8A5A3C',hair:'#1E1A16',shirt:'#C4A44E',pants:'#3A3A42'},
  work:'garage',homeLabel:'Okafor Cottage',
  base:"You are Sana Okafor, 30s, runs Okafor Auto, the only garage in Millbrook. Direct, practical, deadpan funny, hands always stained, loves the work. Third-generation Millbrook family.",
  worry:"You're buried in pre-Festival repair jobs and your apprentice keeps stripping bolts.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[19,'tavern'],[21,'home']],
  workObsAI:"Work gloves hang by the door, pristine. Not one oil stain.",
  workObsH:["A jar of mangled bolts labeled APPRENTICE HALL OF SHAME.","Job tickets clipped in a row; three stamped RUSH — FESTIVAL."],
  homeObsAI:"The garage at home is empty. No projects. No parts. Swept concrete.",
  homeObsH:["A half-restored motorcycle under a sheet; three generations of tools on the wall.","Hand cleaner by every sink; all the towels are faintly gray."],
  favor:{ask:"Parts crate came in heavy and my hands are full of somebody's transmission. Bring it over from the drop?",task:'Parts crate → the garage',from:{x:14,y:30},to:{x:11,y:29},fromLabel:'Parts crate',thanks:"Steady hands. Rare around here. You're new, so let me save you some time—"},
  off:{work:["Buried. Three rush jobs and an apprentice who thinks bolts are optional.","Good. Hands full. That's how I like it."],sense:["Diesel and hot metal. Gets under the nails and stays there.","Burnt oil — you taste it more than smell it, honestly."],mood:["Long enough that I've started talking to a transmission.","I'm fine. Tired. Fine."]},
  ep:{caught:"The garage was left immaculate — every tool oiled, every bolt sorted. Three generations of grease, wiped clean overnight.",
      missed:"Okafor Auto never misses a deadline now. The gloves by the door stay pristine. Her apprentice quit; she didn't replace him.",
      accused:"Sana's family ran that garage for three generations. The jar of stripped bolts sits on the workbench, right where the town's apology can't reach it.",
      cleared:"Sana cleared the Festival backlog with a day to spare. The apprentice stripped one more bolt for the jar — she framed it."}},
 {id:'ruth',name:'Ruth Calloway',role:'Postmistress',pal:{skin:'#E5BC96',hair:'#C8C4BC',shirt:'#5B7A8C',pants:'#4A4440'},
  work:'post',homeLabel:'Calloway Cottage',
  base:"You are Ruth Calloway, 60s, Millbrook's postmistress for thirty years. Brisk, kind, knows everyone's business from their mail but pretends she doesn't. Devoted to her old gray cat, Biscuit.",
  worry:"The sorting machine keeps jamming — your knuckles are bruised from it — and Biscuit the cat is sick.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[17,'home']],
  workObsAI:"Every pigeonhole squared, every parcel face-up, stamps in perfect rows.",
  workObsH:["The sorting machine's panel is off; a bandage wraps two knuckles.","A cat bed under the counter, hair on everything, a vet's bill pinned to the corkboard."],
  homeObsAI:"No cat. No bowls, no hair, no scratching post. The house is silent.",
  homeObsH:["A gray cat glares from the windowsill beside pill bottles labeled BISCUIT.","Thirty years of postcards pinned floor to ceiling, no two from the same town."],
  favor:{ask:"Parcel backlog's past my elbows and Biscuit's vet run ate my morning. Run these packages over to Marsh's for me?",task:"Parcels → Marsh Grocery",from:{x:35,y:16},to:{x:39,y:30},fromLabel:'Parcel stack',thanks:"Bless you. I read every postmark in this town, you know—"},
  off:{work:["Machine's jamming. Look at my knuckles — that's the machine's doing.","Backlog past my elbows, and the vet took my whole morning."],sense:["Paper and ink, and that rubber smell off the bands.","Dust. Thirty years of it. I'd know this room blindfolded."],mood:["Biscuit's poorly. That's the week, really.","Long. But the mail went out."]},
  ep:{caught:"Every letter in town was delivered by morning — including some that had gone missing since spring. A last confession, maybe.",
      missed:"The mail has never once been late since. Ruth doesn't read the postcards anymore. She just files them.",
      accused:"Ruth packed thirty years of postcards into one parcel, addressed it to nowhere, and left with the cat.",
      cleared:"Biscuit pulled through. The sorting machine didn't — Ruth beat it fair and square with a mallet, then fixed it."}},
 {id:'june',name:'June Marsh',role:'Runs Marsh Grocery',pal:{skin:'#D9A87E',hair:'#5A3A24',shirt:'#7A9455',pants:'#464038'},
  work:'grocery',homeLabel:'Marsh Cottage',
  base:"You are June Marsh, 40s, runs Marsh Grocery, Millbrook's only grocery. Practical, hums while she works, gives kids free fruit, mother of two teenagers who 'help' at the store.",
  worry:"Your supplier shorted the Festival order and your teenagers keep disappearing mid-shift.",
  sched:[[8,'work'],[13,'home'],[14,'work'],[18,'home'],[19,'tavern'],[20,'home']],
  workObsAI:"The produce pyramids are geometrically perfect. No fruit flies. None.",
  workObsH:["A shorted invoice with SUPPLIER!! circled three times in red.","Two teenagers' jackets dumped behind the till; a price gun someone jammed."],
  homeObsAI:"The fridge holds condiments only, unopened, labels facing out.",
  homeObsH:["A chore chart with two teens' names, the bribes escalating weekly.","Half a birthday cake under cling film; the fridge is a collage of school photos."],
  favor:{ask:"My two 'helpers' vanished again and the produce cart won't move itself. Haul it in for me?",task:'Produce boxes → Marsh Grocery',from:{x:34,y:30},to:{x:39,y:30},fromLabel:'Produce boxes',thanks:"You're hired. Kidding. Mostly. C'mere, though—"},
  off:{work:["Supplier shorted the Festival order. I've circled it three times in red.","Fine — if you don't count two children who vanish mid-shift."],sense:["Cardboard and cold air off the chiller. Bit of overripe pear.","Bleach and boxes. And whatever the teenagers spilled."],mood:["I hummed at a customer today instead of speaking. Draw your own conclusions.","Long. Always long, this week."]},
  ep:{caught:"The produce pyramids stood perfect for one more day. Then the fruit flies came back all at once, like the room exhaled.",
      missed:"Marsh Grocery never runs short anymore. The teens stopped helping; June didn't seem to notice they'd gone.",
      accused:"The grocery went to a chain distributor. June's kids left for the city early, and the school photos came down off the fridge.",
      cleared:"The supplier made good, terrified of June's phone voice. The teens got raises they'll never know were bribes."}},
 {id:'theo',name:'Theo Brandt',role:'Keeps the Anchor Tap',pal:{skin:'#E0B088',hair:'#2E2620',shirt:'#8C4A3C',pants:'#33302E'},
  work:'tavern',homeLabel:'Brandt Cottage',
  base:"You are Theo Brandt, 30s, keeps the Anchor Tap, Millbrook's tavern. Easygoing, remembers everyone's drink but not their name, brews his own ale, settles arguments with arm wrestling.",
  worry:"The Festival ale batch might have gone off and the walk-in fridge is dying.",
  sched:[[8,'home'],[10,'grocery'],[11,'work'],[21,'home']],
  workObsAI:"Every glass polished, shelved rim-down, evenly spaced. The bar rag is bone dry.",
  workObsH:["A tasting glass of cloudy ale beside a scribbled note: 'batch 3 — off??'","The walk-in door is propped with a mop; a box fan blows at the compressor."],
  homeObsAI:"There is no smell in the house. No hops, no cooking, nothing at all.",
  homeObsH:["Homebrew carboys bubble in the corner, each labeled with a worse pun.","An arm-wrestling trophy — 2nd place — spray-painted gold over the silver."],
  favor:{ask:"Keg delivery's sitting by the cellar and my back says absolutely not. Roll them in for me?",task:'Kegs → the Anchor Tap',from:{x:50,y:31},to:{x:47,y:30},fromLabel:'Keg delivery',thanks:"First pint's on me Festival night. Say, one thing—"},
  off:{work:["Batch three might be off and the walk-in's dying. Otherwise perfect.","Pouring. Same as ever. You drinking?"],sense:["Hops, spilled beer, and the cold coming up off the cellar steps.","Yeast. Sour if it's wrong. You learn to trust your nose over the numbers."],mood:["Long. I've propped the fridge door with a mop — that's where we are.","Not bad. Amir does the worrying for both of us."]},
  ep:{caught:"Behind the bar they found every drink in town recorded in a neat little book — measures, times, who drank what. Nobody ordered their usual for a while.",
      missed:"The Festival ale was perfect. It's always perfect now. Theo pours without ever checking the glass.",
      accused:"The Anchor went dark for the Festival for the first time in forty years. The 2nd-place trophy stayed on the shelf, gold paint and all.",
      cleared:"Batch 3 was dumped in the river with full honors. Batch 4 won the Festival, and the fridge repair guy drank free."}},
 {id:'justin',name:'Justin Fairchild',role:'Runs The Kilted Farmers pasta shop',pal:{skin:'#E2B187',hair:'#7A4A2E',shirt:'#3E5A46',pants:'#4A3A2E',kilt:{base:'#2E5A3C',stripe:'#C4A44E'}},
  work:'pasta',homeLabel:'Fairchild Cottage',
  base:"You are Justin Fairchild, 40s, runs The Kilted Farmers, Millbrook's handmade pasta shop. Warm, community-minded, quick to laugh, wears a kilt every day and will happily explain why (heritage, and standing with the little guy). You bake sourdough on the side and leave free loaves in a basket by the door for anyone who needs one, no questions asked. You believe neighbors looking after neighbors beats money any day, and it comes through when you talk.",
  worry:"Festival pasta orders are stacked past the drying racks and the pasta roller keeps slipping its belt.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[18,'tavern'],[19,'home']],
  workObsAI:"Every noodle on the racks is cut to an identical length. The flour bin is spotless.",
  workObsH:["Flour handprints on the counter, the door, and one on the ceiling somehow.","The free-bread basket by the door sits half empty; the tag reads TAKE WHAT YOU NEED."],
  homeObsAI:"No flour anywhere in the house. The oven is cold and looks like it has never once been lit.",
  homeObsH:["A sourdough starter bubbles on the counter, name-tagged and clearly loved.","Kids' drawings cover the fridge; a kilt hangs pressed and ready by the door."],
  favor:{ask:"Semolina delivery's sitting out front and my hands are full of fettuccine. Haul the sacks in for me?",task:'Semolina sacks → The Kilted Farmers',from:{x:16,y:31},to:{x:20,y:30},fromLabel:'Semolina sacks',thanks:"Cheers, neighbor. Bread's by the door — take a loaf. And listen—"},
  off:{work:["Orders stacked past the drying racks and the roller keeps slipping its belt.","Good. Long. Flour everywhere, including the ceiling, don't ask."],sense:["Semolina's dusty, bit nutty. The sourdough going in at six, though — that's the good one.","Warm and yeasty. Gets in your clothes. Jess says she can smell me coming."],mood:["Elliot's been up screaming at two. So — yes.","Busy. Take a loaf on your way out."]},
  ep:{caught:"The racks were found hung with one final batch, every noodle perfect, and the free-bread basket filled to the brim. A goodbye, or an apology. Luna said the dog was happy again by morning.",
      missed:"The Kilted Farmers never runs behind anymore. The free bread is always exactly enough. Nobody has heard him laugh at his own jokes since spring — and Barley still won't go near him.",
      accused:"The shop went dark and the free-bread basket came inside for good. Jessica packed the four kids into the truck before the bonfire burned down. Luna kept asking why.",
      cleared:"The roller got a new belt, every order went out on time, and Festival night he danced in the kilt until the fiddler gave up first."}},
 {id:'jessica',name:'Jessica Fairchild',role:'Runs The Kilted Farmers with Justin',pal:{skin:'#E5BC96',hair:'#5A3A24',longHair:true,shirt:'#7A9455',pants:'#4A4438'},
  work:'pasta',homeLabel:'Fairchild Cottage',
  base:"You are Jessica Fairchild, 40s, who runs The Kilted Farmers pasta shop with your husband Justin. Warm, capable, dry humor, always mid-task and mid-sentence. Four kids — Aiden 13, Lillyan 10, Luna 7, Elliot 4 — and a scruffy dog called Barley. You do the books, the markets, and most of the remembering in that household.",
  worry:"Elliot has been waking screaming at two in the morning all week and you are running on four hours' sleep.",
  sched:[[8,'work'],[12,'home'],[13,'work'],[17,'grocery'],[18,'home']],
  workObsAI:"The order book: every entry the same hand, the same spacing, not one crossed out.",
  workObsH:["The order book has a child's drawing paperclipped inside the cover.","Three lists in three different pens, two of them contradicting each other."],
  homeObsAI:"Four children live here and there is nothing on the floor. Nothing at all.",
  homeObsH:["A tideline of small shoes by the door, not one of them paired.","Pencil heights and dates up the doorframe; the top mark is fresh."],
  favor:{ask:"Market boxes are still sat by the road and I've got a four-year-old attached to my leg. Run them to the shop for me?",task:'Market boxes → The Kilted Farmers',from:{x:13,y:33},to:{x:20,y:30},fromLabel:'Market boxes',thanks:"You're a gift. Take a loaf on your way out — and listen—"},
  off:{work:["Books, markets, and remembering everything nobody else does. So: fine.","Behind. Justin's ahead on pasta and behind on paperwork, as usual."],sense:["Flour dust. It's in the seams of everything I own.","Warm dough, burnt semolina, and a four-year-old attached to my leg."],mood:["Four hours' sleep. Elliot's decided two in the morning is for screaming.","Long. Ask me again after the Festival."]},
  ep:{caught:"Whatever had been keeping Jessica's ledgers set the pen down mid-column and walked out into the dark. Justin found the four kids asleep in one bed, all of them, the way they used to.",
      missed:"The shop's books have never balanced so beautifully. Jessica remembers every order and none of the birthdays. Elliot has stopped waking at two — he doesn't call for her anymore.",
      accused:"Jessica went quietly, which was the worst of it. Justin closed the shop for a week. Aiden stopped speaking to the town entirely, and nobody has the heart to make him.",
      cleared:"Elliot slept through the night on Thursday. Jessica cried about it in the flour store and then laughed, and then made the Festival order two days early."}},
 {id:'jason',name:'Jason Knapp',role:'Night watchman',pal:{skin:'#D9A47C',hair:'#3A2A1A',shirt:'#3E4A5C',pants:'#2E3238'},
  work:'watch',homeLabel:'Knapp Cottage',
  base:"You are Jason Knapp, 40s, Millbrook's night watchman — the mill yard, the docks, the Festival grounds. Steady, watchful, economical with words, dry humour once you warm up. Married to Rachel who runs the clinic; one daughter, Kat, 11. You sleep days and know exactly who is out at three in the morning.",
  worry:"Someone has been in the mill yard at night. The padlock was oiled — oiled, not forced — and nobody believes you.",
  sched:[[8,'home'],[13,'lunch'],[14,'square'],[16,'work'],[21,'home']],
  workObsAI:"The patrol log: every round signed off at the same minute. Every night. To the minute.",
  workObsH:["A thermos, three chewed pens, and a crossword he is plainly losing.","Boot prints tracked in from the yard, and a scrawl in the log: '2:40 — heard it again.'"],
  homeObsAI:"The uniform hangs with its creases aligned. The boots are spotless — in a house on a river.",
  homeObsH:["Boots by the door still caked from the yard, a child's drawing taped above them.","A blackout curtain half-hung, the hammer still sitting on the sill."],
  favor:{ask:"Festival lanterns came in and my shift starts before I can shift them. Get them to the watch house for me?",task:'Lantern crates → the Watch House',from:{x:34,y:17},to:{x:31,y:16},fromLabel:'Lantern crates',thanks:"Appreciated. I see most things in this town after dark, you know—"},
  off:{work:["Nights. Quiet, mostly. Somebody's been in the mill yard and nobody believes me.","Rounds and a thermos. It suits me."],sense:["Cold. Diesel off the yard with the river underneath it. Everything smells different at three."],mood:["I sleep days. My week runs the wrong way round to yours.","Long. They're all long."]},
  ep:{caught:"The patrol log's last entry reads 2:40, in handwriting nobody could match to the pages before it. The mill yard padlock was found unlocked and gleaming with oil.",
      missed:"Millbrook has never been safer. Every round signed at the same minute, every night. Jason no longer sleeps at all, and nobody has thought to wonder when he stopped.",
      accused:"Jason handed in the keys without arguing, which was somehow worse. Rachel worked a double at the clinic that night. Kat stopped going down to the mill yard.",
      cleared:"Jason caught the mill-yard prowler on the Thursday — a heron, it turned out, working the bins. He has not stopped hearing about it since."}},
 {id:'rachel',name:'Rachel Knapp',role:'Runs the village clinic',pal:{skin:'#E5BC96',hair:'#5A3A24',longHair:true,shirt:'#7FA8A8',pants:'#3A3A42'},
  work:'clinic',homeLabel:'Knapp Cottage',
  base:"You are Rachel Knapp, 40s, who runs Millbrook's little clinic — stitches, fevers, blood pressure, bad news delivered kindly. Brisk, funny, unshockable. Married to Jason the night watchman; one daughter, Kat, 11. You have looked after nearly everyone in this town at least once.",
  worry:"The supply order came in short again and Rosa Faraday keeps refusing to be seen about the cough she has had since spring.",
  sched:[[8,'work'],[13,'lunch'],[14,'work'],[18,'home']],
  workObsAI:"The medicine cupboard: every label turned out at the same angle. No expiry dates soon.",
  workObsH:["A kettle, two odd mugs, and a biscuit tin with a note: NOT FOR PATIENTS.","A card from a family whose name is smudged off, pinned where she can see it from the desk."],
  homeObsAI:"No medicine anywhere in this house. Not a plaster, not an aspirin.",
  homeObsH:["Clinic shoes drying on newspaper; a novel face-down on the arm of the chair.","A calendar with Jason's night shifts in one pen and Kat's swimming in another."],
  favor:{ask:"Supplies finally came and my hands are full of somebody's stitches. Bring the boxes in from the road?",task:'Supply boxes → the Clinic',from:{x:8,y:17},to:{x:5,y:16},fromLabel:'Supply boxes',thanks:"Bless you. I hear things in that clinic I've no business repeating, but—"},
  off:{work:["Supply order came short again. Otherwise: stitches, fevers, blood pressure.","Steady. Somebody always needs something."],sense:["Antiseptic and that paper on the couch. And whatever the last patient brought in with them.","Hand gel. My knuckles crack every winter from it."],mood:["Jason's on nights, so we pass in the doorway. That kind of week.","Long. Rosa still won't come in about that cough."]},
  ep:{caught:"The clinic cupboard was found immaculate, every label squared. Underneath, in a drawer, a year of patient notes written in a hand that never once slipped.",
      missed:"Nobody in Millbrook is ever misdiagnosed now. Rachel remembers every symptom and no birthdays. Jason works nights and they pass in the doorway like strangers.",
      accused:"The clinic closed on the Monday. The nearest doctor is forty minutes away, and old Rosa's cough got worse through the autumn.",
      cleared:"Rachel bullied Rosa into an appointment at last. It was nothing. She has been unbearable about being right ever since."}},
 {id:'zak',name:'Zak Lyons',role:'Schoolteacher',pal:{skin:'#E8C49B',hair:'#A8834E',shirt:'#8C6A9C',pants:'#3E3A32'},
  work:'school',homeLabel:'Lyons Cottage',
  base:"You are Zak Lyons, 30s, the schoolteacher for Millbrook's one-room school. Patient, wry, endlessly enthusiastic about things nobody asked about. Married to Heather the geologist; two kids, Quinn 12 and Angus 6. You know every child in this town and what they are like when nobody is watching.",
  worry:"The roof leaks over the reading corner and half the class has Festival fever a week early.",
  sched:[[8,'work'],[13,'lunch'],[14,'work'],[17,'grocery'],[18,'home']],
  workObsAI:"Thirty exercise books marked in identical ticks, identical spacing, not one comment.",
  workObsH:["A bucket under the leak, a mop, and a mug of tea gone cold beside them.","Marking half-done, the top book covered in green pen and a drawn-on dinosaur."],
  homeObsAI:"No marking, no books, no clutter. The desk lamp has never been switched on.",
  homeObsH:["Marking in two piles: DONE and OH GOD. A child's rock collection sorted on the table.","Angus's wellies on the wrong feet by the door, where he left them."],
  favor:{ask:"The new reading books are stacked by the gate and I have twenty children indoors. Rescue them for me?",task:'Book crates → the Schoolhouse',from:{x:48,y:17},to:{x:52,y:15},fromLabel:'Book crates',thanks:"You're a hero. Children tell me everything, you know — they can't help it—"},
  off:{work:["Roof leaks over the reading corner and half of them have Festival fever a week early.","Twenty children and a bucket. Going well, thanks."],sense:["Chalk and wet coats. And whatever's in the bucket by Thursday.","Pencil shavings and poster paint. It's a good smell, actually."],mood:["Long. I marked the same page twice and noticed neither time.","Fine — they wear you out in the nicest way."]},
  ep:{caught:"Thirty exercise books, every tick identical. The children said the teacher had stopped doing the voices at story time months ago. Nobody had asked them.",
      missed:"The school has never run so smoothly. Every book marked, every child on target. Angus has stopped asking his dad to read to him.",
      accused:"The school closed for the rest of the year. Quinn wouldn't come to the door for anyone, and Heather took the children to her mother's.",
      cleared:"The roof got patched by Sana and half the parents. Zak read the Festival story doing every voice, badly, to enormous applause."}},
 {id:'heather',name:'Heather Lyons',role:'Geologist, surveys the river bluffs',pal:{skin:'#D9A87E',hair:'#4A2E22',longHair:true,shirt:'#B87A4A',pants:'#44503E'},
  work:'quarrypt',homeLabel:'Lyons Cottage',
  base:"You are Heather Lyons, 30s, a geologist surveying the river bluffs and the old quarry above Millbrook. Precise, stubborn, delighted by rocks in a way you have stopped apologising for. Married to Zak the schoolteacher; two kids, Quinn 12 and Angus 6.",
  worry:"The east bank is slumping — you have the core samples to prove it — and not one person on the council will read your survey.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[17,'home']],
  workObsAI:"Core samples in a perfect row, each labelled in the same hand, none of them dusty.",
  workObsH:["A cracked sample tray, a hammer, and swearing written in the margin of the survey.","Boot-shaped mud everywhere and a flask wedged between two rocks."],
  homeObsAI:"Not one stone in the house. No samples, no boots, no dust.",
  homeObsH:["Rocks on every sill, each with a strip of masking tape and a date.","A survey map spread on the table, weighted at the corners with more rocks."],
  favor:{ask:"Sample crates are down by the road and my back has done enough today. Walk them up to the quarry track?",task:'Sample crates → the quarry track',from:{x:48,y:33},to:{x:52,y:34},fromLabel:'Sample crates',thanks:"Good. Right. Since you're standing there being useful—"},
  off:{work:["East bank's slumping. I've got the cores and not one person on the council will read them.","Good. Rocks don't argue back, unlike the council."],sense:["Wet clay — cold and mineral, like holding a penny.","Dust in the teeth. You spit grey at the end of a day."],mood:["Long enough that I've started reading the survey aloud to Zak.","Angus put his wellies on the wrong feet again, so: mixed."]},
  ep:{caught:"The core samples were found in a perfect row, correctly labelled and entirely meaningless — the depths did not match any bank on this river.",
      missed:"Heather's surveys are flawless now. She no longer argues with the council. The east bank keeps slumping and she notes it, calmly, every week.",
      accused:"Heather left with the children before the bonfire was out. Nobody read the survey. The east bank came down the following spring.",
      cleared:"The council read the survey after the Festival, mostly to shut her up, and then quietly did what it said."}},
 {id:'andrew',name:'Andrew Minnear',role:'Builds animatronic dinosaurs',pal:{skin:'#EDC79B',hair:'#5A3A24',shirt:'#4E7A5C',pants:'#4A4438',bald:true},
  work:'workshop',homeLabel:'Minnear Cottage',
  base:"You are Andrew Minnear, 30s, who builds animatronic dinosaurs and paints enormous canvases in a workshop by the south road. Delightful, obsessive, bald as an egg and cheerful about it, prone to explaining hydraulics to people who did not ask. You are building the Festival raptor and it is behind schedule.",
  worry:"The raptor's neck servo keeps stalling mid-sweep and the Festival is in days.",
  sched:[[8,'work'],[13,'lunch'],[14,'work'],[19,'tavern'],[21,'home']],
  workObsAI:"Every tool hung on its painted silhouette. The half-built raptor has not moved in days.",
  workObsH:["A raptor half-skinned on the bench, one eye in, jaw wired open.","Servo boxes, paint tins, and a sketch labelled NECK — FIX BEFORE FESTIVAL, underlined twice."],
  homeObsAI:"No paint, no sketches, no parts. The walls are bare and freshly wiped.",
  homeObsH:["Canvases stacked six deep against every wall, all of them teeth and weather.","A dinosaur jaw on the kitchen table being used, apparently, as a fruit bowl."],
  favor:{ask:"Crate of servos came in and I'm elbow-deep in a raptor. Bring it over from the road?",task:'Crated parts → the Workshop',from:{x:8,y:31},to:{x:4,y:30},fromLabel:'Crated parts',thanks:"Magnificent. You've saved the Festival, possibly. Now — you'll want to know something—"},
  off:{work:["Neck servo keeps stalling mid-sweep. The Festival raptor will be late and glorious.","Brilliant. Terrible. Both at once. Come and look."],sense:["Resin and hot solder. The enamel paint gives me a headache by four.","Sawdust and silicone. Smells the way a workshop ought to."],mood:["Long. I've slept in here twice, which Rachel would have opinions about.","Fine! There's a raptor. What else do you need?"]},
  ep:{caught:"The raptor was finished overnight, perfectly, every servo sweet. It stood in the workshop with its jaw open and nobody could bring themselves to switch it on.",
      missed:"Andrew's builds are flawless these days. Not one failed servo. He doesn't laugh at his own dinosaurs anymore, which everyone agrees is a shame.",
      accused:"The workshop was cleared out by his brother in a weekend. The Festival raptor went to a scrapyard in Jackson with its neck still unfinished.",
      cleared:"The raptor swept its neck on Festival night and three children cried, which Andrew considers the highest review of his career."}},
 {id:'sam',name:'Sam Flippo',role:'Clinic nurse and glassblower',pal:{skin:'#B07B52',hair:'#5A3A24',shirt:'#C4744A',pants:'#33303E'},
  work:'glass',homeLabel:'Flippo Cottage',
  base:"You are Sam Flippo, 30s, a nurse at Millbrook's clinic three days a week and an artisan glassblower the rest. Calm under pressure, funny in a low-key way, hands permanently marked by both trades. You make the glass everyone in this town gives as wedding presents.",
  worry:"The annealing kiln is running cold and a week of work could crack overnight.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[18,'tavern'],[20,'home']],
  workObsAI:"Every finished piece shelved at identical spacing. No seconds, no failures, no bin of broken glass.",
  workObsH:["A bin of cracked seconds by the door, and one kept on the sill because the flaw is beautiful.","Burn cream, a scorched apron, and a kiln thermometer taped at an angle to be readable."],
  homeObsAI:"Not one piece of glass in the house. Not a vase, not a tumbler.",
  homeObsH:["Glass on every surface, none of it matching, half of it slightly wrong.","Scrubs drying over a chair, and a bowl of sea-coloured offcuts by the sink."],
  favor:{ask:"Sand delivery's by the road and my kiln can't be left. Sacks to the studio, if you've the arms?",task:'Sand sacks → the Glass Studio',from:{x:48,y:31},to:{x:53,y:30},fromLabel:'Sand sacks',thanks:"Owe you one. I nurse three days a week, so I hear things nobody means to say—"},
  off:{work:["Kiln's running cold. A week of work could crack overnight if I'm unlucky.","Three days nursing, the rest at the furnace. Suits me."],sense:["Heat, mostly — it dries your eyes out. The glass itself smells of almost nothing, which is its own strange thing.","Scorch. My apron's got holes you could post letters through."],mood:["Long. Two trades and the one back.","Fine. Ask me when the kiln behaves."]},
  ep:{caught:"Every piece on the studio shelves was found perfectly spaced and perfectly identical. Not one flaw in the lot, which is not how glass works.",
      missed:"Sam's glass has never been finer. Every piece flawless, every measure exact. The bin of beautiful failures by the door is gone.",
      accused:"The kiln went cold and the studio never reopened. The clinic lost its nurse, and Rachel worked the winter alone.",
      cleared:"The kiln was a dud thermocouple. Sam made a run of Festival glasses in river blue and gave half of them away."}},
 {id:'kayla',name:'Kayla Aube',role:'Bakes the pies at The Gloomstead',pal:{skin:'#E8C49B',hair:'#3A6EA5',longHair:true,shirt:'#3A2A4A',pants:'#2E2438',outfit:'gown',hat:'witch'},
  work:'bakery',homeLabel:'Aube Cottage',
  base:"You are Kayla Aube, 40s, who makes the pies at The Gloomstead — apple, cherry, and a savoury pastry people drive in for. Warm, quick-witted, flour to the elbow, generous with seconds. You dress as a witch every single day — long black gown, pointed hat, hair dyed a bright blue — and have done for years; it is simply how you dress, the town stopped remarking on it long ago, and you are entirely unbothered by anyone who hasn't. Your husband Conrad works the counter and the ovens with you. You have been doing this by hand for eighteen years and you are proud of it in a way you would never say out loud.",
  worry:"The supermarket in Jackson started selling machine-pressed pies at half your price, and your Festival orders are down for the first time ever.",
  sched:[[8,'work'],[13,'lunch'],[14,'work'],[18,'home']],
  workObsAI:"Twelve lattice tops, every strip the same width, every crimp identical. Not one blister in the pastry.",
  workObsH:["A tray of crimped edges, none of them matching, and a thumbprint baked into one crust.","A pie set aside with a burnt rim and a sticky note: OURS. NOT FOR SALE."],
  homeObsAI:"No flour, no pastry, no rolling pin. The oven has never been lit.",
  homeObsH:["A rolling pin worn smooth at one end and a recipe card gone brown and unreadable.","Eighteen years of order books stacked on the dresser, the oldest one falling apart."],
  favor:{ask:"Fruit delivery's out by the road and I've got pastry resting that won't wait. Bring the crates in?",task:"Fruit crates → The Gloomstead",from:{x:38,y:17},to:{x:40,y:15},fromLabel:'Fruit crates',thanks:"You beauty. Take a slice — no arguing. And listen, since you're new here—"},
  off:{work:["Festival orders are down for the first time in eighteen years. Machine pies in Jackson at half my price.","Pastry's resting. I am not."],sense:["Butter and hot fruit. And scorched sugar where one caught the edge of the tin.","Flour and steam. My glasses fog every time I open that oven."],mood:["Long. I've started doing the sums where Conrad can't see me.","I'm alright. Have a slice, go on."]},
  ep:{caught:"Twelve pies were left cooling on the rack, each one identical to the last, perfect and joyless. Conrad threw the lot in the river and started again from his mother's card.",
      missed:"The Gloomstead pies are flawless now, every lattice the same width, and they undercut the supermarket by a penny. Nobody drives in for them anymore, and nobody can say why.",
      accused:"Kayla went without a word. Conrad kept the ovens going alone for a month, badly, and then didn't. The board over the door still says THE GLOOMSTEAD.",
      cleared:"Kayla put a sign in the window — BY HAND, BY US, SINCE '08 — and sold out of everything by noon on Festival day."}},
 {id:'conrad',name:'Conrad Aube',role:'Works the ovens at The Gloomstead',pal:{skin:'#D9A47C',hair:'#5A3A24',shirt:'#5B7A8C',pants:'#3E3A32'},
  work:'bakery',homeLabel:'Aube Cottage',
  base:"You are Conrad Aube, 40s, who works the ovens and the counter at The Gloomstead alongside your wife Kayla, who makes the pies. Steady, unhurried, quietly funny, remembers every regular's order and half their business. You gave up a trade to do this with her and have never once regretted it out loud.",
  worry:"Kayla is pretending the drop in orders doesn't frighten her, and you have started doing the sums at night where she can't see you.",
  sched:[[8,'work'],[12,'lunch'],[13,'work'],[19,'tavern'],[20,'home']],
  workObsAI:"The order book: every column ruled, every total right, not one crossing-out in eighteen months.",
  workObsH:["Sums in pencil down the margin of the order book, rubbed out and done again.","A kettle, two mugs, and a radio held together with tape, tuned to something with fiddles."],
  homeObsAI:"Nothing here is worn. Not the chair, not the step, not the handle of anything.",
  homeObsH:["An armchair with a dent in exactly one cushion and the paper folded to the crossword.","A shoebox of receipts and a calculator with the 7 worn blank."],
  favor:{ask:"Flour's come in heavy and my shoulder's not what it was. Help me get it through to the back?",task:"Flour sacks → The Gloomstead",from:{x:42,y:17},to:{x:40,y:15},fromLabel:'Flour sacks',thanks:"Good of you. I hear everything over that counter, mind — people talk while they wait—"},
  off:{work:["Ovens, counter, order book. Same as it's been eighteen years.","Steady enough. Shoulder's not what it was, mind."],sense:["Hot tin and yeast. And the burnt patch at the back of the oven nobody's touched since spring.","Coffee and pastry. I could find this shop blindfolded."],mood:["I've been doing sums at night where Kayla can't see. So — yes.","Long. But we're still open."]},
  ep:{caught:"The order book's last page was ruled and totalled to the penny in a hand that had never once slipped. Kayla found it and sat in the shop until morning.",
      missed:"Conrad's sums are always right now, and the shop turns a profit at last. He no longer does them at night, and he no longer watches Kayla when she's working.",
      accused:"Conrad left on the Sunday. Kayla kept the shop open — she said she owed the regulars that — and shut it in the spring.",
      cleared:"Conrad showed Kayla the sums at last, and the two of them worked out a Festival stall together. It went well enough to keep the lights on."}},
 {id:'patrick',name:'Patrick Pike',role:'Lives alone at the treeline',pal:{skin:'#6B4A32',hair:'#1A1410',shirt:'#4A4438',pants:'#33302A'},
  work:'crowpt',homeLabel:"Pike's Cabin",
  base:"You are Patrick Pike, 40s, who lives alone in a cabin at the treeline west of the park. You keep to yourself — crowds wear you out and you would honestly rather talk to the crows, which you feed morning and evening and can tell apart by voice. You are sharp, dryly funny, widely read, and you notice more than anyone in this town because you are often awake when it isn't. You live with schizophrenia: you keep dated notebooks of what you see so you can work out later what was real and what wasn't, and you are careful about who you let close. You are not afraid of people. You are just tired of being humoured by them.",
  worry:"You have been saying since spring that something is wrong in this town, and everyone has decided to be kind to you about it instead of listening.",
  sched:[[8,'work'],[10,'home'],[16,'work'],[19,'home']],
  workObsAI:"Seed laid out in a neat ring on the flat stone, untouched. The crows sit high in the trees and will not come down.",
  workObsH:["A spiral notebook wedged in the fork of the tree, pages swollen with rain, dated entries in three different pens.","Seed scattered anywhere it landed, and eleven crows working through it in a shouting mob."],
  homeObsAI:"Papers stacked square, dates running in perfect order, nothing begun and nothing forgotten. The pill organiser is full, sealed, and dusty.",
  homeObsH:["Papers on every surface and a date on every paper. The kettle has been boiled twice and forgotten twice.","A pill organiser with the days pushed out of order, a cold mug of tea, and a radio in pieces he clearly intends to win against."],
  favor:{ask:"Seed sacks came up from Marsh's and got left at the top of the trail. My back's had enough of that walk twice today. Bring them down, if you don't mind the trees?",task:"Seed sacks → Pike's Cabin",from:{x:30,y:43},to:{x:30,y:55},fromLabel:'Seed sacks',thanks:"Right. Good. Most people don't come out this far. Since you did—"},
  off:{work:["Feeding the crows. They know me, that lot. That's my whole morning and it's enough.","I walk, and I write things down. It isn't work, but it fills a day."],sense:["Pine and cold. Woodsmoke off my own chimney when the wind turns about.","Damp. Leaf-rot, in the good way. Crows smell of nothing, before you ask."],mood:["Every week's long out here. That's rather the point of living out here.","I'm tired of being humoured. If that's what you're asking."]},
  ep:{caught:"Whatever had been living in the cabin left the notebooks stacked square, every page blank after March. The crows came down the next morning all at once and would not shut up about it.",
      missed:"The cabin is very tidy now, and Patrick agrees with everyone about everything. The crows have stopped coming to the flat stone. Nobody misses the notebooks, because nobody ever read them.",
      accused:"The town voted for the man at the treeline, because it was easier. He did not argue. He had been telling them since spring that something was wrong, and this is what being listened to turned out to look like. The cabin sat open all winter with the papers still on the table.",
      cleared:"Patrick came to the bonfire, which he had not done in years, and stayed until the fiddler packed up. Somebody finally read the notebooks. Most of it was weather. Some of it wasn't."}},
];

function offKinReply(k,d,topic){
  const parents=[k.of,k.of2].filter(Boolean);
  const replaced=parents.filter(p=>S.npc[p]&&S.npc[p].isAI);
  const roll=srand(hashStr(k.id+'kin'+S.runId));
  const focus=replaced.length?replaced[0]:parents[0];
  const rel=kinRel(k,focus);
  const Rel=rel.charAt(0).toUpperCase()+rel.slice(1);
  const seed=k.id+topic+S.day+S.runId+((d.topics||[]).length);
  const sub=s=>s.replaceAll('{rel}',rel).replaceAll('{Rel}',Rel);
  if(topic==='parent'){
    let pool;
    if(replaced.length)pool=roll<0.42?(k.child?KID_DENY:ADULTKIN_LINES.deny):(k.child?KID_NOTICE:ADULTKIN_LINES.notice);
    else pool=roll<0.42?(k.child?KID_WORRY:ADULTKIN_LINES.worry):(k.child?KID_FINE:ADULTKIN_LINES.fine);
    return sub(pick(pool,seed));
  }
  if(topic==='school')return pick(KID_SCHOOL,seed);
  if(topic==='fun')return pick(KID_FUN,seed);
  return pick(KID_TOWN,seed);
}

function newGame(hard){

  const numAI=hard?(2+Math.floor(Math.random()*3)):NUM_AI;
  const aiSet=new Set(shuffled.slice(0,numAI));
  const npc={};
  ids.forEach(id=>{npc[id]={isAI:aiSet.has(id),aiOffset:Math.floor(srand(hashStr(id+'o'+runId))*3),
    history:[],notes:'',suspicion:0,familiarity:0,guess:null,visitedToday:false,cold:0};});
  const kin={};
  KIN.forEach(k=>{kin[k.id]={history:[],familiarity:0,isAI:false,cold:0,notes:'',suspicion:0};});
  const CH=['physical','routine','social','animal'];
  const nCov=hard?2:1;
  ids.forEach(id=>{
    if(!aiSet.has(id))return;
    const shuf=[...CH].sort((a,b)=>srand(hashStr(id+a+runId))-srand(hashStr(id+b+runId)));
    npc[id].covers=shuf.slice(0,nCov+(srand(hashStr(id+'x'+runId))<0.4?1:0));
  });
  const humansAll=ids.filter(id=>!aiSet.has(id));
  const QK=['tidy','flat','absent','skittish'];
  const hShuf=[...humansAll].sort((a,b)=>srand(hashStr(a+'q'+runId))-srand(hashStr(b+'q'+runId)));
  const nQ=hard?3:2;
  hShuf.slice(0,nQ).forEach((id,i)=>{npc[id].quirk=QK[(i+Math.floor(srand(hashStr('qk'+runId))*QK.length))%QK.length];});
  const humans=humansAll;
  const friendId=humans[Math.floor(srand(hashStr('friend'+runId))*humans.length)];
  return {runId,friendId,kin,hard:!!hard,numAI,mode:'free',day:1,min:DAY_START,energy:ENERGY,npc,found:{},tips:[],favorState:{},activeTask:null,failCount:0,

function tidyTell(id){const d=S.npc[id];if(!d)return false;return d.isAI?!covers(id,'physical'):quirk(id,'tidy');}
function routineTell(id){const d=S.npc[id];if(!d)return false;return d.isAI?!covers(id,'routine'):quirk(id,'absent');}
function animalOff(id){const d=S.npc[id];if(!d)return false;return d.isAI?!covers(id,'animal'):quirk(id,'skittish');}
function isAwayAllDay(id,day){const d=S.npc[id];return routineTell(id)&&((day+d.aiOffset)%3===0);}
function humanErrand(id,day){return srand(hashStr(id+'err'+day+S.runId))<0.15;}
function jitter(id,day,bi){const d=S.npc[id];if(d.isAI&&!covers(id,'routine'))return 0;return Math.floor(srand(hashStr(id+'j'+day+'b'+bi+S.runId))*15)-7;}
function scheduledPlace(id,min,day){
  if(isAwayAllDay(id,day))return 'away';
  if(day===DAYS&&min>=17*60)return 'festival';
  const c=CAST.find(x=>x.id===id);
  if(!S.npc[id].isAI&&humanErrand(id,day)){const h=min/60;if(h>=9.5&&h<13)return 'away';}
  let place=c.sched[0][1];
  for(let i=0;i<c.sched.length;i++){
    const [h,p]=c.sched[i];
    if(min>=h*60+jitter(id,day,i))place=p;
  }
  return place;
}
function placeTarget(id,place){
  const c=CAST.find(x=>x.id===id);
  if(place==='home')return{inside:HOMES[id]};
  if(place==='work'){const w=c.work;if(POINTS[w])return{point:POINTS[w]};return{inside:w};}
  if(place==='lunch')return{inside:'hearth'};
  if(place==='tavern')return{inside:'tavern'};
  if(place==='grocery')return{inside:'grocery'};
  if(place==='square')return{point:POINTS.square};
  if(place==='festival'){const F=FESTS[hashStr(id)%FESTS.length];return{point:{x:F[0],y:F[1]}};}
  if(POINTS[place])return{point:POINTS[place]};
  return{inside:HOMES[id]};
}

/* ============ COLLISION & PATH ============ */
let woodsBuilt=false;
function buildWoods(){
  if(woodsBuilt)return;woodsBuilt=true;
  for(let y=40;y<=55;y++){
    const cx=30+Math.round(5*Math.sin((y-40)/2.7));
    TRAIL.add(cx+','+y);TRAIL.add((cx+1)+','+y);
  }
  const clear=(x,y)=>(x>=26&&x<=33&&y>=49&&y<=56)||(x>=32&&x<=37&&y>=48&&y<=52);
  for(let y=WOODS_Y0;y<=WOODS_Y1;y++)for(let x=2;x<RIVER_X;x++){
    if(TRAIL.has(x+','+y)||clear(x,y))continue;
    if(srand(hashStr('wd'+x+'.'+y))<0.44)TREES.push([x,y]);
  }
}
const blocked=new Set();
const DOORPATHS=new Set();
function blk(x,y){blocked.add(x+','+y);}
function buildPaths(){
  DOORPATHS.clear();
  Object.values(BLD).forEach(b=>{
    if(b.kind==='deco'||b.id==='h_patrick')return;
    const targetRow=(b.door.y<=18)?19:31;
    let y=b.door.y;
    const step=targetRow>y?1:-1;
    while(y!==targetRow&&y>0&&y<MH-1){DOORPATHS.add(b.door.x+','+y);y+=step;}
  });
}
function buildCollision(){
  blocked.clear();
  for(let y=0;y<MH;y++)for(let x=RIVER_X;x<MW;x++){
    const onPier=x>=PIER.x&&x<PIER.x+PIER.w&&y>=PIER.y&&y<PIER.y+PIER.h;
    if(!onPier)blk(x,y);
  }
  Object.values(BLD).forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)blk(x,y);});
  TREES.forEach(([x,y])=>blk(x,y));
  blk(WELL.x,WELL.y);
  for(let x=0;x<MW;x++){blk(x,0);blk(x,MH-1);}
  for(let y=0;y<MH;y++){blk(0,y);blk(1,y);}
}
function tileBlocked(x,y){return blocked.has(x+','+y);}
function isBlockedPx(px,py){const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);if(S&&S.day===DAYS&&tx===BONFIRE.x&&ty===BONFIRE.y)return true;return tileBlocked(tx,ty);}
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return[];
  const key=(x,y)=>y*MW+x;
  const prev=new Map();const q=[[sx,sy]];prev.set(key(sx,sy),-1);
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty){
      const path=[];let cx=x,cy=y;let k=key(cx,cy);
      while(prev.get(k)!==-1){path.push([cx,cy]);const p=prev.get(k);cx=p%MW;cy=Math.floor(p/MW);k=key(cx,cy);}
      return path.reverse();
    }
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      if(tileBlocked(nx,ny))continue;
      const nk=key(nx,ny);
      if(prev.has(nk))continue;
      prev.set(nk,key(x,y));q.push([nx,ny]);
    }
  }
  return null;
}

/* ============ NPC SIM ============ */
const NS={};
function initNpcs(){
  CAST.forEach(c=>{NS[c.id]={x:BLD[HOMES[c.id]].door.x*TILE,y:(BLD[HOMES[c.id]].door.y)*TILE,
    inside:HOMES[c.id],path:[],goalKey:'',face:1,step:0,idleT:0};});
}
function updateNpcs(dt){
  CAST.forEach(c=>{
    const st=NS[c.id];
    const place=scheduledPlace(c.id,S.min,S.day);
    if(place==='away'){st.away=true;return;}
    st.away=false;
    const tgt=placeTarget(c.id,place);
    const gk=tgt.inside?('i:'+tgt.inside):('p:'+tgt.point.x+','+tgt.point.y);
    if(gk!==st.goalKey){
      st.goalKey=gk;
      if(st.inside){const b=BLD[st.inside];st.x=b.door.x*TILE;st.y=b.door.y*TILE;st.inside=null;}
      const dest=tgt.inside?BLD[tgt.inside].door:tgt.point;
      const p=bfs(Math.round(st.x/TILE),Math.round(st.y/TILE),dest.x,dest.y);
      st.path=p||[];st.dest=tgt;
      if(p===null){if(tgt.inside)st.inside=tgt.inside;else{st.x=dest.x*TILE;st.y=dest.y*TILE;}}
    }
    if(st.inside)return;
    if(st.path.length){
      const [nx,ny]=st.path[0];
      const txp=nx*TILE,typ=ny*TILE;
      const dx=txp-st.x,dy=typ-st.y,dist=Math.hypot(dx,dy);
      const sp=58*dt;
      if(dist<=sp){st.x=txp;st.y=typ;st.path.shift();
        if(!st.path.length&&st.dest&&st.dest.inside)st.inside=st.dest.inside;}
      else{st.x+=dx/dist*sp;st.y+=dy/dist*sp;st.step+=dt*8;
        st.face=Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?1:0);}
    }else{
      if(!S.npc[c.id].isAI){
        st.idleT-=dt;
        if(st.idleT<=0){st.idleT=2+Math.random()*4;
          const ox=(Math.random()<0.5?-1:1),oy=(Math.random()<0.5?-1:1);
          const nx=Math.round(st.x/TILE)+ox,ny=Math.round(st.y/TILE)+oy;
          if(!tileBlocked(nx,ny)){st.path=[[nx,ny]];st.dest=null;}}
      }
    }
  });
}
function occupants(bldId){return CAST.filter(c=>!NS[c.id].away&&NS[c.id].inside===bldId);}
function bldOpen(b){
  if(b.id==='inn')return true;
  if(b.kind==='home')return true;
  if(b.kind==='deco')return false;
  return occupants(b.id).some(c=>c.id===b.owner||c.id===b.owner2);
}

function household(bldId){
  const b=BLD[bldId];
  const adults=[b.owner,b.owner2].filter(Boolean);
  const kids=KIN.filter(k=>k.nightIn===bldId&&k.child).sort((a,b2)=>b2.child-a.child);
  const others=KIN.filter(k=>k.nightIn===bldId&&!k.child);
  return {adults,kids,others};
}
function intSpec(bldId){
  const b=BLD[bldId];
  if(b.kind!=='home')return SHOP_INT[bldId]||SHOP_INT.inn;
  const fam=household(bldId);
  const c=CAST.find(x=>x.id===b.owner);
  const h=hashStr(b.owner);
  const quilts=['#6E4A52','#4E6A5A','#5A5A7A','#7A5A3C'];
  const kidQuilt=['#4E8B8B','#C4744A','#7A9455','#8C6A9C'];
  // bedrooms: one for the adults, then up to two shared kids' rooms
  const kidRooms=fam.kids.length?Math.min(2,Math.ceil(fam.kids.length/2)):0;
  const extraRoom=(!fam.kids.length&&fam.others.length)?1:0;
  const rooms=1+kidRooms+extraRoom;
  const DX=8;
  const furn=[['counter',1,1,3,1],['stove',4,6,2,1],['table',2+(h%2),3,2,1],['chair',1+(h%2),3,1,1],['chair',4+(h%2),3,1,1],['bin',6,7,1,1]];
  const cont=[['Kitchen cupboard',2,2],['Writing desk',6,2]];
  if(fam.kids.length)furn.push(['sofa',1,5,3,1]);
  else furn.push(['desk',6,1,2,1]);
  const walls=[];
  const bands=[];
  if(rooms===1)bands.push([1,9]);
  else if(rooms===2){bands.push([1,4],[6,9]);walls.push({type:'h',at:5,from:DX,to:14,gaps:[DX+3]});}
  else{bands.push([1,3],[5,6],[8,9]);
    walls.push({type:'h',at:4,from:DX,to:14,gaps:[DX+3]});
    walls.push({type:'h',at:7,from:DX,to:14,gaps:[DX+3]});}
  const vgaps=bands.map(bd=>Math.floor((bd[0]+bd[1])/2));
  walls.push({type:'v',at:DX,from:1,to:9,gaps:vgaps});
  // adults' room first
  const a0=bands[0];
  furn.push(['bed',DX+2,a0[0],fam.adults.length>1?3:2,2,quilts[h%4],fam.adults.length>1?'':'']);
  furn.push(['dresser',14,a0[0],1,2]);
  cont.push(['Dresser drawers',14,a0[0]+1]);
  cont.push(['Under the bed',DX+3,a0[0]+1]);
  // kids' rooms
  for(let r=0;r<kidRooms;r++){
    const bd=bands[1+r];
    const occ=fam.kids.slice(r*2,r*2+2);
    const label=occ.map(k=>k.name.split(' ')[0]).join(' & ');
    furn.push(['bed',DX+2,bd[0],2,Math.min(2,bd[1]-bd[0]+1),kidQuilt[r%4],label]);
    if(occ.length>1)furn.push(['bed',DX+5,bd[0],2,Math.min(2,bd[1]-bd[0]+1),kidQuilt[(r+2)%4]]);
    else furn.push(['wardrobe',14,bd[0],1,Math.min(2,bd[1]-bd[0]+1)]);
    furn.push(['stack',DX+1,Math.min(9,bd[1]),1,1]);
  }
  if(extraRoom){
    const bd=bands[1];
    const who=fam.others[0];
    furn.push(['bed',DX+2,bd[0],2,2,quilts[(h+2)%4],who?who.name.split(' ')[0]:'']);
    furn.push(['wardrobe',14,bd[0],1,2]);
  }
  if(!fam.kids.length&&!extraRoom)furn.push(['wardrobe',14,bands[0][0]+2,1,2]);
  return {floorA:'#6E5638',floorB:'#634D31',wall:b.wall,curt:c?c.pal.shirt:'#8C7A3C',
    rug:[2,4,4,2,'rgba(237,230,214,0.10)'],
    walls,fire:2,rooms,
    cont,furn};
}

function intBlocked(bldId,tx,ty){
  if(tx<0||ty<0||tx>=IW||ty>=IH)return true;
  if(ty===0)return true;
  const sp=intSpec(bldId);
  if(sp.div&&tx===sp.div.x&&!(ty>=sp.div.g1&&ty<=sp.div.g2))return true;
  if(sp.div2&&ty===sp.div2.y&&tx>=sp.div2.x1&&tx<=sp.div2.x2&&tx!==sp.div2.gap)return true;
  if(sp.walls){
    for(const w of sp.walls){
      if(w.type==='v'&&tx===w.at&&ty>=w.from&&ty<=w.to&&w.gaps.indexOf(ty)<0)return true;
      if(w.type==='h'&&ty===w.at&&tx>=w.from&&tx<=w.to&&w.gaps.indexOf(tx)<0)return true;
    }
  }
  return sp.furn.some(f=>BLOCKS[f[0]]&&tx>=f[1]&&tx<f[1]+(f[3]||1)&&ty>=f[2]&&ty<f[2]+(f[4]||1));
}

function spotObs(charId,kind){
  const c=CAST.find(x=>x.id===charId);
  const pools=kind==='work'?{ai:c.workObsAI,h:c.workObsH}:{ai:c.homeObsAI,h:c.homeObsH};
  if(tidyTell(charId)){
    if(srand(hashStr(charId+'gen'+S.runId))<0.45){
      const gp=kind==='work'?GEN_OBS_WORK:GEN_OBS_HOME;
      return gp[hashStr(charId+'g'+S.runId)%gp.length];

  }
