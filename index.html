/* ============ FAVORS ============ */
function offersForDay(day){
  const c1=CAST.filter(c=>!isAwayAllDay(c.id,day)&&S.npc[c.id].cold<=0).map(c=>c.id);
  return [...c1].sort((a,b)=>srand(hashStr(a+'f'+day+S.runId))-srand(hashStr(b+'f'+day+S.runId))).slice(0,2);
}
function favorKey(id){return S.day+'-'+id;}
function favorStatus(id){
  if(!offersForDay(S.day).includes(id))return null;
  return S.favorState[favorKey(id)]||'pending';
}

/* ============ INPUT ============ */
const keys={};let playerStep=0,playerFace=1;
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if((e.key==='e'||e.key===' '||e.key==='Enter')&&!paused){const t=nearestInteract();if(t){e.preventDefault();doInteract(t);}}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
let joyVec={x:0,y:0};
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');
let joyActive=false,joyCenter={x:0,y:0};
joy.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true;const r=joy.getBoundingClientRect();joyCenter={x:r.left+55,y:r.top+55};},{passive:false});
window.addEventListener('touchmove',e=>{
  if(!joyActive)return;
  const t=e.touches[0];
  let dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y;
  const m=Math.hypot(dx,dy);
  if(m>40){dx=dx/m*40;dy=dy/m*40;}
  stick.style.left=(37+dx)+'px';stick.style.top=(37+dy)+'px';
  joyVec={x:dx/40,y:dy/40};
},{passive:true});
window.addEventListener('touchend',()=>{joyActive=false;joyVec={x:0,y:0};stick.style.left='37px';stick.style.top='37px';});
document.getElementById('actBtn').addEventListener('click',()=>{if(!paused){const t=nearestInteract();if(t)doInteract(t);}});

/* ============ INTERACT ============ */
function nearestInteract(){
  const R=1.9*TILE;let best=null,bd=R;
  if(S.scene==='world'){
    if(S.activeTask){
      const c=CAST.find(x=>x.id===S.activeTask.npcId);
      if(!S.activeTask.carried&&S.activeTask.done<3){
        const d=Math.hypot(c.favor.from.x*TILE-S.px,c.favor.from.y*TILE-S.py);
        if(d<bd){bd=d;best={type:'pickup',c};}}
      if(S.activeTask.carried){
        const d=Math.hypot(c.favor.to.x*TILE-S.px,c.favor.to.y*TILE-S.py);
        if(d<bd){bd=d;best={type:'drop',c};}}
    }
    CAST.forEach(c=>{
      const st=NS[c.id];
      if(!st.away&&!st.inside){
        const d=Math.hypot(st.x-S.px,st.y-S.py);
        if(d<bd){bd=d;best={type:'npc',c};}}
    });
    OUTSPOTS.forEach(sp=>{
      const d=Math.hypot(sp.x*TILE-S.px,sp.y*TILE-S.py);
      if(d<bd){bd=d;best={type:'spot',sp};}
    });
    KIN.forEach(k=>{
      const pl=kinPlace(k);if(pl.inside)return;
      const d=Math.hypot(pl.point.x*TILE-S.px,pl.point.y*TILE-S.py);
      if(d<bd){bd=d;best={type:'kin',k};}
    });
    PETS.forEach(p=>{
      if(p.inB||p.x===undefined)return;
      const d=Math.hypot(p.x*TILE-S.px,p.y*TILE-S.py);
      if(d<bd){bd=d;best={type:'pet',p};}
    });
    CURIOS.forEach(cu=>{
      const d=Math.hypot(cu.x*TILE-S.px,cu.y*TILE-S.py);
      if(d<bd){bd=d;best={type:'curio',cu};}
    });
    (S.keepsakes||[]).forEach(k=>{
      if(k.taken)return;
      const d=Math.hypot(k.x*TILE-S.px,k.y*TILE-S.py);
      if(d<bd){bd=d;best={type:'keep',k};}
    });
    Object.values(BLD).forEach(b=>{
      if(b.kind==='deco')return;
      const d=Math.hypot(b.door.x*TILE-S.px,(b.door.y*TILE)-S.py);
      if(d<bd){bd=d;best={type:'door',b};}
    });
  }else{
    const bldId=S.scene;
    occupants(bldId).forEach(c=>{
      const st=NS[c.id];
      const d=Math.hypot((st.ix||0)-S.ipx,(st.iy||0)-S.ipy);
      if(d<bd){bd=d;best={type:'npc',c};}
    });
    KIN.forEach(k=>{
      const pl=kinPlace(k);if(pl.inside!==bldId||k._ix===undefined)return;
      const d=Math.hypot(k._ix-S.ipx,k._iy-S.ipy);
      if(d<bd){bd=d;best={type:'kin',k};}
    });
    PETS.forEach(p=>{
      if(p.inB!==bldId||p._ix===undefined)return;
      const d=Math.hypot(p._ix-S.ipx,p._iy-S.ipy);
      if(d<bd){bd=d;best={type:'pet',p};}
    });
    intSpec(bldId).cont.forEach((cn,ci)=>{
      const d=Math.hypot(cn[1]*TILE-S.ipx,cn[2]*TILE-S.ipy);
      if(d<bd){bd=d;best={type:'cont',bldId,ci,name:cn[0]};}
    });
    if(bldId==='inn'){
      const db=Math.hypot(11.5*TILE-S.ipx,4.3*TILE-S.ipy);
      if(db<bd){bd=db;best={type:'sleep'};}
      const dn=Math.hypot(13.5*TILE-S.ipx,3.4*TILE-S.ipy);
      if(dn<bd){bd=dn;best={type:'note'};}
    }
    if(bldId==='pasta'){
      const dbr=Math.hypot(5.2*TILE-S.ipx,8.2*TILE-S.ipy);
      if(dbr<bd){bd=dbr;best={type:'take'};}
    }
    const d=Math.hypot(7*TILE-S.ipx,(IH-1)*TILE-S.ipy);
    if(d<bd){bd=d;best={type:'exit',bldId};}
  }
  return best;
}
function interactLabel(t){
  if(t.type==='npc')return 'Talk to '+t.c.name+'  (E)';
  if(t.type==='spot')return t.sp.label+'  (E)';
  if(t.type==='cont')return 'Search: '+t.name+'  (E)';
  if(t.type==='sleep')return S.day>=DAYS?'Turn in — tomorrow is the Festival  (E)':'Sleep in your room  (E)';
  if(t.type==='take')return S.tookBread===S.day?'Free bread — one each, neighbor':'Take a loaf — free bread  (E)';
  if(t.type==='note')return 'Re-read the note  (E)';
  if(t.type==='kin')return 'Talk to '+t.k.name.split(' ')[0]+'  (E)';
  if(t.type==='pet')return (t.p.kind==='dog'?'Say hello to ':'Pet ')+t.p.name+'  (E)';
  if(t.type==='curio')return t.cu.label+'  (E)';
  if(t.type==='keep')return 'Something glints in the grass  (E)';
  if(t.type==='pickup')return 'Pick up: '+t.c.favor.fromLabel+'  (E)';
  if(t.type==='drop')return 'Set it down here  (E)';
  if(t.type==='exit')return 'Leave  (E)';
  if(t.type==='door'){
    const open=bldOpen(t.b);
    return open?('Enter '+t.b.label+'  (E)'):(t.b.label+' — locked, dark inside');
  }
  return'';
}
function doInteract(t){
  if(t.type==='sleep'){doSleep();return;}
  if(t.type==='kin'){openChat(t.k.id);return;}
  if(t.type==='pet'){
    const petOff=animalOff(t.p.of);
    const ownName=CAST.find(x=>x.id===t.p.of).name.split(' ')[0];
    let txt;
    if(t.p.kind==='dog'){
      txt=petOff
        ?t.p.name+" leans into your hand, tail going. Then "+ownName+"'s voice carries from the next room and the dog goes stiff — ears flat, backing away, watching the doorway. It won't go to "+ownName+". It hasn't in a long time, by the look of it."
        :t.p.name+" flops over for a belly rub immediately, all four legs in the air. When "+ownName+" calls, the dog is gone mid-scratch, thrilled, skidding on the boards.";
    }else{
      txt=petOff
        ?t.p.name+" allows exactly one stroke, then slides off the sill and puts the whole room between you and it. It sits where it can see the door and does not blink."
        :t.p.name+" headbutts your knuckles, purring like a bad engine, and settles into the warm patch you were standing in.";
    }
    S.found2=S.found2||[];
    if(!S.found2.some(e=>e.bld==='pet:'+t.p.id&&e.day===S.day)){
      S.found2.push({bld:'pet:'+t.p.id,ci:0,day:S.day,who:t.p.of,label:t.p.name+' the '+t.p.kind,text:txt,sig:false});save();
    }
    openObs({label:t.p.name},txt);
    return;
  }
  if(t.type==='note'){openNote();return;}
  if(t.type==='curio'){
    S.curios=S.curios||[];
    const isNew=!S.curios.includes(t.cu.id);
    if(isNew){S.curios.push(t.cu.id);if(t.cu.item)addPocket(t.cu.item,null);save();}
    openObs({label:t.cu.label},t.cu.text+(isNew&&t.cu.item?'\n\n('+t.cu.item+' — pocketed.)':''));
    return;
  }
  if(t.type==='keep'){
    const own=CAST.find(x=>x.id===t.k.owner);
    const kind=KEEP_KINDS[t.k.i%KEEP_KINDS.length];
    const label=kind.item.replace('{N}',own.name);
    t.k.taken=true;save();
    addPocket(label,null,t.k.owner);
    openObs({label:'Something in the grass'},t.k.find+'\n\n'+label+'. Whatever it is, it has been out here a long while — since last spring, by the look of it.\n\n(Pocketed. Somebody might want this back.)');
    return;
  }
  if(t.type==='take'){
    if(S.tookBread===S.day){showToast('One each, neighbor — that\'s how it stays free.');return;}
    S.tookBread=S.day;save();
    addPocket('Fresh sourdough loaf','justin');
    return;
  }
  if(t.type==='door'){
    if(!bldOpen(t.b)){showToast(t.b.label+' is locked. Dark inside.');return;}
    S.scene=t.b.id;S.ipx=7*TILE;S.ipy=(IH-2)*TILE;save();return;
  }
  if(t.type==='exit'){
    const b=BLD[t.bldId];
    S.scene='world';S.px=b.door.x*TILE;S.py=(b.door.y+1)*TILE;save();return;
  }
  if(t.type==='pickup'){S.activeTask.carried=true;save();return;}
  if(t.type==='drop'){
    S.activeTask.carried=false;S.activeTask.done++;
    if(S.activeTask.done>=3){
      const c=t.c;S.favorState[S.activeTask.key]='done';
      S.npc[c.id].familiarity=Math.min(30,S.npc[c.id].familiarity+6);
      S.activeTask=null;save();openFavorDone(c);
    }else{save();showToast(t.c.favor.task+' — '+S.activeTask.done+'/3');}
    return;
  }
  if(t.type==='npc'){
    const d=S.npc[t.c.id];
    if(!d.visitedToday){
      if(S.energy<=0){showToast('No visits left today. Sleep to reset.');return;}
      S.energy--;d.visitedToday=true;save();updateHud();
    }
    openChat(t.c.id);
    return;
  }
  if(t.type==='cont'){
    const b=BLD[t.bldId];
    const ownerHere=occupants(t.bldId).some(c=>c.id===b.owner);
    if(b.kind==='home'&&ownerHere){showToast('Not with '+CAST.find(c=>c.id===b.owner).name.split(' ')[0]+' standing right there.');return;}
    const text=contObs(t.bldId,t.ci);
    S.found2=S.found2||[];
    if(!S.found2.some(e=>e.bld===t.bldId&&e.ci===t.ci&&e.day===S.day)){
      S.found2.push({bld:t.bldId,ci:t.ci,day:S.day,who:b.owner,label:t.name,text,sig:t.ci===sigIndex(t.bldId)});
      save();
    }
    openObs({label:t.name},text);
    return;
  }
  if(t.type==='spot'){
    const sp=t.sp;
    const fkey=sp.charId+'-'+sp.kind+'-d'+S.day;
    const obs=spotObs(sp.charId,sp.kind);
    if(!S.found[fkey]){S.found[fkey]=obs;save();}
    openObs(sp,obs);
    return;
  }
}

/* ============ LOOP ============ */
let last=0,forcedSleep=false,lastMinShown=-1;
function realLoop(ts){
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(!paused){
    S.min+=dt*MIN_PER_SEC;
    if(S.min>=DAY_END&&!forcedSleep){forcedSleep=true;openNightfall();}
    let vx=0,vy=0;
    if(keys['w']||keys['arrowup'])vy-=1;
    if(keys['s']||keys['arrowdown'])vy+=1;
    if(keys['a']||keys['arrowleft'])vx-=1;
    if(keys['d']||keys['arrowright'])vx+=1;
    vx+=joyVec.x;vy+=joyVec.y;
    const m=Math.hypot(vx,vy);
    if(m>0.1){
      vx/=Math.max(1,m);vy/=Math.max(1,m);
      const sp=135*dt;
      const HW=8,FT=17,FB=23;
      if(S.scene==='world'){
        const nx=S.px+vx*sp,ny=S.py+vy*sp;
        const freeW=(px,py)=>!isBlockedPx(px+16-HW,py+FT)&&!isBlockedPx(px+16+HW,py+FT)
          &&!isBlockedPx(px+16-HW,py+FB)&&!isBlockedPx(px+16+HW,py+FB);
        if(freeW(nx,S.py))S.px=nx;
        if(freeW(S.px,ny))S.py=ny;
      }else{
        const bid=S.scene;
        const nx=S.ipx+vx*sp,ny=S.ipy+vy*sp;
        const ib=(px,py)=>intBlocked(bid,Math.floor(px/TILE),Math.floor(py/TILE));
        const freeI=(px,py)=>!ib(px+16-HW,py+FT)&&!ib(px+16+HW,py+FT)
          &&!ib(px+16-HW,py+FB)&&!ib(px+16+HW,py+FB);
        if(freeI(nx,S.ipy))S.ipx=nx;
        if(freeI(S.ipx,ny))S.ipy=ny;
      }
      playerStep+=dt*8;
      playerFace=Math.abs(vx)>Math.abs(vy)?(vx>0?2:3):(vy>0?1:0);
    }
    updateNpcs(dt);
    const t=nearestInteract();
    const hint=document.getElementById('actionHint');
    if(t&&hint.dataset.toast!=='1'){hint.innerText=interactLabel(t);hint.style.display='block';}
    else if(!t&&hint.dataset.toast!=='1')hint.style.display='none';
    const tb=document.getElementById('taskBanner');
    if(tb){
      if(S.activeTask&&S.scene==='world'){
        const tc=CAST.find(x=>x.id===S.activeTask.npcId);
        tb.innerText=(S.activeTask.carried?'Carrying — ':'')+tc.favor.task+' · '+S.activeTask.done+'/3 · follow the gold arrow';
        tb.style.display='block';
      }else tb.style.display='none';
    }
    const mm=Math.floor(S.min);
    if(mm!==lastMinShown){lastMinShown=mm;updateHud();}
    draw();
  }
  requestAnimationFrame(realLoop);
}

function fmtTime(){const h=Math.floor(S.min/60),m=Math.floor(S.min%60);return h+':'+(m<10?'0':'')+m;}
function updateHud(){
  document.getElementById('dayTag').innerText='DAY '+S.day+'/'+DAYS+' · '+fmtTime();
  let dots='';for(let i=0;i<ENERGY;i++)dots+='<span class="dot '+(i<S.energy?'':'spent')+'"></span>';
  document.getElementById('energyTag').innerHTML='VISITS '+dots;
  document.getElementById('sleepBtn').innerText=S.day>=DAYS?'Festival →':'Sleep';
}
async function doSleep(){
  if(S.day>=DAYS){openAccuse();return;}
  let broke=[];
  offersForDay(S.day).forEach(id=>{
    if(S.favorState[favorKey(id)]==='accepted'){
      S.favorState[favorKey(id)]='failed';
      S.npc[id].cold=2;S.failCount++;
      broke.push(CAST.find(c=>c.id===id).name.split(' ')[0]);
    }
  });
  S.activeTask=null;forcedSleep=false;
  S.ateToday=false;
  CAST.forEach(c=>{if(S.npc[c.id].cold>0)S.npc[c.id].cold--;S.npc[c.id].visitedToday=false;});
  S.day++;S.min=DAY_START;S.energy=ENERGY;
  S.scene='world';S.px=45*TILE;S.py=16*TILE;
  await save();updateHud();closeOverlay();
  if(broke.length)showToast('You never showed for '+broke.join(' and ')+'. Word travels.');
  else{
    const left=DAYS-S.day;
    showToast('Day '+S.day+'. '+(left===0?'The Festival is tonight.':left+' day'+(left===1?'':'s')+' until the Festival.'));
  }
}

function cycleOpt(field,dir){
  const p=S.player;
  if(field==='longHair'){p.longHair=!p.longHair;}
  else if(field==='outfit'){const i=Math.max(0,OUTFITS.indexOf(p.outfit));p.outfit=OUTFITS[(i+dir+OUTFITS.length)%OUTFITS.length];}
  else if(field==='hat'){const i=Math.max(0,HATS.indexOf(p.hat));p.hat=HATS[(i+dir+HATS.length)%HATS.length];}
  else{
    const arr=CUSTOM_OPTS[field];
    const i=Math.max(0,arr.indexOf(p[field]));
    p[field]=arr[(i+dir+arr.length)%arr.length];
  }
  save();
  const tr=document.getElementById('tartanRow');
  if(tr)tr.style.display=p.outfit==='kilt'?'flex':'none';
  const bl=document.getElementById('botLabel');if(bl)bl.innerText=OUTFIT_LABELS[p.outfit];
  const hl=document.getElementById('hairLenLabel');if(hl)hl.innerText=p.longHair?'Long':'Short';
  const htl=document.getElementById('hatLabel');if(htl)htl.innerText=HAT_LABELS[p.hat];
  drawPreview();
}

function openFavorDone(c){

  const cands=untold.length?untold:pool;
  const target=cands[Math.floor(srand(hashStr(c.id+'tip'+S.day+S.runId))*cands.length)];

function kinRel(c,pid){
  if(c.rel==='son'||c.rel==='daughter')return pid==='jessica'?'mum':'dad';
  if(c.rel==='granddaughter')return 'gran';
  if(c.rel==='mother')return 'son';
  if(c.rel==='apprentice')return 'boss';
  if(c.rel==='wife')return 'husband';
  if(c.rel==='husband')return c.of==='iris'?'wife':'husband';
  return 'family';
}
function kinSystem(c,d,opener,gift){
  const parents=[c.of,c.of2].filter(Boolean);
  const replaced=parents.filter(p=>S.npc[p]&&S.npc[p].isAI);
  const roll=srand(hashStr(c.id+'kin'+S.runId));
  const focus=replaced.length?replaced[0]:parents[0];
  const parent=CAST.find(x=>x.id===focus);
  const pName=parent.name.split(' ')[0];
  const rel=kinRel(c,focus);
  const young=c.child&&c.child<=8, teen=c.child&&c.child>=13;
  let s=c.base+KIN_SHARED;
  if(c.child)s+=CHILD_GUARD;
  s+='\nIt is Day '+S.day+' of Festival Week, around '+fmtTime()+'.';
  if(replaced.length){
    if(roll<0.42){
      s+='\nQUIET TRUTH: people have started saying your '+rel+' '+pName+' seems different lately, and you HATE it. You defend them fiercely — they are just tired, it has been a hard year, everyone should mind their own business. You believe this. Do not agree that anything is wrong with them, even if pressed. (You may still be perfectly friendly about everything else.)';
    }else{

async function pingAPI(){
  try{
    const res=await apiCall({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:'user',content:'Reply with the single word: pong'}]});
    let data={};try{data=await res.json();}catch(e){}
    if(data&&data.error)return{ok:false,err:(data.error.type||'api error')+(data.error.message?': '+String(data.error.message).slice(0,90):'')};
    if(!res.ok)return{ok:false,err:'HTTP '+res.status};
    const t=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    return t?{ok:true}:{ok:false,err:'empty response'};
  }catch(e){return{ok:false,err:(e&&e.message)?String(e.message).slice(0,90):'network error'};}
}

    const g=S.npc[c.id].guess;
    return '<div class="accuse-row">'
      +'<div><strong>'+c.name+'</strong><div class="hint">'+c.role+' · suspicion '+S.npc[c.id].suspicion+'</div></div>'
      +'<div class="tg" data-npc="'+c.id+'">'
      +'<button data-g="human" class="'+(g==='human'?'ah':'')+'">Human</button>'
      +'<button data-g="ai" class="'+(g==='ai'?'aa':'')+'">Replaced</button>'
      +'</div></div>';
  }).join('');
  const aiCount=CAST.filter(c=>S.npc[c.id].guess==='ai').length;
  const ready=CAST.every(c=>S.npc[c.id].guess)&&(S.hard?aiCount>=1:aiCount===S.numAI);
  OR.innerHTML='<div class="overlay"><div class="sheet">'
    +'<h3>The accusation</h3>'
    +'<div class="sub">'+(S.hard?('You do not know how many were replaced. You\'ve marked '+aiCount+'.'):('Exactly '+S.numAI+' were replaced. You\'ve marked '+aiCount+'.'))+' What you choose here cannot be undone — the town will act on your word.</div>'
    +rows
    +'<div class="sheet-actions">'
    +'<button id="cancelBtn">Not yet</button>'
    +'<button class="primary" id="submitBtn" '+(ready?'':'disabled')+'>'+(ready?'Name them at the Festival':(S.hard?'Mark everyone, and name at least one':'Mark exactly '+S.numAI))+'</button>'
    +'</div></div></div>';
  document.querySelectorAll('.tg').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>{
      b.onclick=async()=>{S.npc[g.dataset.npc].guess=b.dataset.g;await save();renderAccuse();};
    });
  });
  document.getElementById('cancelBtn').onclick=closeOverlay;
  const sb=document.getElementById('submitBtn');
  if(sb&&!sb.disabled)sb.onclick=async()=>{S.ended=true;await save();openResults();};
}
function openResults(){
  paused=true;
  let caught=0,innocent=0,missed=0;
  CAST.forEach(c=>{
    const d=S.npc[c.id];
    if(d.isAI&&d.guess==='ai')caught++;
    if(!d.isAI&&d.guess==='ai')innocent++;
    if(d.isAI&&d.guess!=='ai')missed++;
  });
  const rows=CAST.map(c=>{
    const d=S.npc[c.id];
    const truth=d.isAI?'REPLACED':'HUMAN';
    const right=(d.isAI&&d.guess==='ai')||(!d.isAI&&d.guess==='human');
    let ep;
    if(d.isAI)ep=d.guess==='ai'?c.ep.caught:c.ep.missed;
    else ep=d.guess==='ai'?c.ep.accused:c.ep.cleared;
    return '<div class="reveal '+(right?'rc':'rw')+'">'
      +'<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">'
      +'<strong>'+c.name+'</strong>'
      +'<span class="mono" style="font-size:11px;">'+truth+' — you said '+(d.guess==='ai'?'REPLACED':'HUMAN')+' '+(right?'✓':'✗')+'</span>'
      +'</div><div class="tell">'+ep+'</div></div>';
  }).join('');
  let banner;
  if(caught===S.numAI&&innocent===0){
    banner="You named all three. Millbrook exhales. What became of the real three, no one ever learned — the town lights three candles at every Festival now."+(S.failCount>=3?" And some folks still remember the promises you dropped along the way.":"");
  }else if(caught>=Math.max(1,S.numAI-1)){
    banner="Two imposters unmasked — but an innocent paid for your certainty, and something still walks Millbrook wearing a friendly face.";
  }else{
    banner="The vote turns. By midnight the loudest voice at the bonfire is asking how the newcomer knew so much. You leave Millbrook before dawn.";
  }
  const coda=missed>0?'<div class="verdict" style="color:var(--magenta);font-style:italic;">On the Festival\'s last night, two more strangers checked into the Inn. Room 2 was made up for them.</div>':'';
  const fr=CAST.find(x=>x.id===S.friendId);
  const frGuess=S.npc[S.friendId].guess;
  let frLine;
  if(frGuess==='ai')frLine='The note under your door was written by '+fr.name+' — coarse grey paper, a pen that skipped. They saw what was happening and were too frightened to sign their name. You named them at the bonfire. They never told you it was them.';
  else if(caught===S.numAI&&innocent===0)frLine='The note under your door was written by '+fr.name+'. At the bonfire they said nothing, but afterward they pressed your hand and held on a moment too long.';
  else frLine='The note under your door was written by '+fr.name+' — coarse grey paper, a pen that skipped. They watched you all week, hoping. They have not slept since.';
  const friendCard='<div class="tipcard" style="margin-top:12px;"><strong>A friend</strong><div class="hint">'+esc(frLine)+'</div></div>';
  OR.innerHTML='<div class="overlay"><div class="sheet">'
    +'<canvas id="endCv" width="520" height="150" style="width:100%;border-radius:6px;border:1px solid var(--line);image-rendering:pixelated;margin-bottom:10px;"></canvas>'
    +'<h3>The Founders\' Festival</h3>'
    +'<div class="score">'+caught+' / '+S.numAI+' unmasked</div>'
    +'<div class="verdict">'+banner+'</div>'
    +rows+coda+friendCard
    +'<div class="sheet-actions"><button class="primary" id="againBtn">Begin again — a different spring, different replacements</button></div>'
    +'</div></div>';
  drawEnding((caught===S.numAI&&innocent===0)?'perfect':(caught>=Math.max(1,S.numAI-1)?'partial':'fail'));
  document.getElementById('againBtn').onclick=async()=>{
    const keepLook=S.player;const wasHard=S.hard;S=newGame(wasHard);S.player=keepLook;forcedSleep=false;
    await save();initNpcs();updateHud();openTitle();
  };
}
function drawEnding(kind){
  const cvt=document.getElementById('endCv');if(!cvt)return;
  const g=cvt.getContext('2d');g.imageSmoothingEnabled=false;
  const W=520,H=150;
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0A0D1E');sky.addColorStop(1,'#232B52');
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  for(let i=0;i<24;i++){g.fillStyle='rgba(237,230,214,0.5)';g.fillRect(srand(hashStr('es'+i))*W,srand(hashStr('ey'+i))*H*0.5,2,2);}
  g.fillStyle='#1B2E1E';g.fillRect(0,H-26,W,26);
  for(let k=0;k<10;k++){const px=88+k*36+(k%2)*6;g.fillStyle='#10131F';g.fillRect(px,H-44,9,18);g.fillRect(px+1,H-51,7,8);}
  if(kind==='fail'){
    g.fillStyle='#2A2A32';g.fillRect(248,H-40,26,10);
    g.fillStyle='rgba(150,150,160,0.35)';g.fillRect(257,H-72,4,28);
    g.fillStyle='rgba(150,150,160,0.2)';g.fillRect(262,H-84,3,14);
  }else{
    g.fillStyle='#E0662D';g.beginPath();g.moveTo(260,H-86);g.lineTo(277,H-30);g.lineTo(243,H-30);g.closePath();g.fill();
    g.fillStyle='#E0A63D';g.beginPath();g.moveTo(260,H-66);g.lineTo(271,H-30);g.lineTo(249,H-30);g.closePath();g.fill();
    g.fillStyle='#F2D08A';g.fillRect(256,H-46,8,14);
  }
  if(kind==='perfect'){
    for(let c2=0;c2<3;c2++){const cx2=234+c2*24;
      g.fillStyle='#EDE6D6';g.fillRect(cx2,H-106,6,14);
      g.fillStyle='#E0A63D';g.beginPath();g.arc(cx2+3,H-110,3.4,0,7);g.fill();}
  }
}

/* ============ INIT ============ */
(async function(){
  await load();
  buildWoods();
  buildCollision();
  buildPaths();
  buildTiles();
  initNpcs();
  CAST.forEach(c=>{
    const place=scheduledPlace(c.id,S.min,S.day);
    if(place==='away'){NS[c.id].away=true;return;}
    const tgt=placeTarget(c.id,place);
    const st=NS[c.id];
    st.goalKey=tgt.inside?('i:'+tgt.inside):('p:'+tgt.point.x+','+tgt.point.y);
    if(tgt.inside){st.inside=tgt.inside;}
    else{st.inside=null;st.x=tgt.point.x*TILE;st.y=tgt.point.y*TILE;}
  });
  resize();
  updateHud();
  if(S.ended)openResults();
  else if(!S.started)openTitle();
  else paused=false;
  requestAnimationFrame(realLoop);
})();
</script>
